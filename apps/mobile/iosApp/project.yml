# XcodeGen spec — generate the Xcode project with `xcodegen generate` (run from apps/mobile/iosApp on macOS).
# The generated iosApp.xcodeproj is git-ignored; this file is the source of truth.
name: iosApp

options:
  bundleIdPrefix: com.vrticconnect
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"   # the Gradle script phase writes into build/xcode-frameworks
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""                  # set locally or via `xcodegen --spec` overrides; do not commit a team id

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vrticconnect.app
        PRODUCT_NAME: "Vrtić Connect"
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        # Static framework produced by :shared-ui:embedAndSignAppleFrameworkForXcode
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared-ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "SharedUi"
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared-ui:embedAndSignAppleFrameworkForXcode
