# Local development stack. `docker compose up -d db` is enough for backend development
# (run the API with ./gradlew run). `docker compose --profile app up --build` also builds
# and runs the migration job and the API in containers.
name: vrtic-connect

services:
  db:
    image: postgres:17.11
    container_name: vrtic-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      APP_DB_NAME: ${APP_DB_NAME:-vrtic}
      APP_DB_OWNER_PASSWORD: ${APP_DB_OWNER_PASSWORD:?set APP_DB_OWNER_PASSWORD in .env}
      APP_DB_RUNTIME_PASSWORD: ${APP_DB_RUNTIME_PASSWORD:?set APP_DB_RUNTIME_PASSWORD in .env}
      APP_DB_WORKER_PASSWORD: ${APP_DB_WORKER_PASSWORD:?set APP_DB_WORKER_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vrtic-db-data:/var/lib/postgresql/data
      - ./scripts/db/00_roles.sh:/docker-entrypoint-initdb.d/00_roles.sh:ro
      - ./scripts/db/00_roles.sql:/opt/vrtic/db/00_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["app"]
    build:
      context: ./backend
    image: vrtic-backend:local
    command: ["migrate"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DB_HOST: db
      DB_PORT: "5432"
      APP_DB_NAME: ${APP_DB_NAME:-vrtic}
      APP_DB_OWNER_PASSWORD: ${APP_DB_OWNER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: ["app"]
    image: vrtic-backend:local
    command: ["serve"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_HTTP_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      APP_DB_NAME: ${APP_DB_NAME:-vrtic}
      APP_DB_RUNTIME_PASSWORD: ${APP_DB_RUNTIME_PASSWORD}
      APP_WEB_ORIGIN: ${APP_WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "${APP_HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  vrtic-db-data:
