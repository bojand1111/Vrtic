      properties:
        days:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                description: Date within the requested week (calendar date, YYYY-MM-DD).
              attends:
                type: boolean
                description: Attends.
              arrivalTime:
                type: string
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                description: Arrival (wall-clock HH:MM in the organization timezone).
                examples:
                  - "08:00"
              departureTime:
                type: string
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                description: Departure (wall-clock HH:MM in the organization timezone).
                examples:
                  - "08:00"
            required:
              - date
              - attends
            additionalProperties: false
          description: Days to set as overrides (1..7). Days not listed are unchanged. A day equal to the template removes the override.
          minItems: 1
          maxItems: 7
        reason:
          type: string
          description: Reason.
          maxLength: 300
      required:
        - days
      additionalProperties: false
    DailyPlan:
