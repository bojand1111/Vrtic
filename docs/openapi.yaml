          type: string
          format: date
          description: Date (calendar date, YYYY-MM-DD).
        weekday:
          type: integer
          description: ISO weekday.
          minimum: 1
          maximum: 7
        isExpected:
          type: boolean
          description: Expected to attend.
        expectedArrival:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Expected arrival (wall-clock HH:MM in the organization timezone).
          examples:
            - "08:00"
        expectedDeparture:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Expected departure (wall-clock HH:MM in the organization timezone).
          examples:
            - "08:00"
        source:
          $ref: "#/components/schemas/ScheduleSource"
        isLateChange:
          type: boolean
          description: Override created after the deadline.
        overrideId:
          type:
            - string
            - "null"
          format: uuid
          description: Override producing this day.
        absenceId:
          type:
            - string
            - "null"
          format: uuid
          description: Absence producing this day.
        closureDayId:
          type:
            - string
            - "null"
          format: uuid
          description: Closure producing this day.
        isFrozen:
          type: boolean
          description: Historical day whose plan will not change any more.
        isEditable:
          type: boolean
          description: Whether the caller may still change this day (deadline, frozen, closure).
        overrideVersion:
          type: integer
          minimum: 0
          description: Version of the day override, to send as `If-Match` on `PUT/DELETE .../overrides/{date}`; `0` when there is none.
        overrideReason:
          type:
            - string
            - "null"
          description: Reason of the day override, when there is one.
        closureName:
          type:
            - string
            - "null"
          description: Name of the closure day, when `source` is CLOSURE.
        absenceKind:
          type:
            - string
            - "null"
          enum:
            - SICK
            - VACATION
            - OTHER
            - null
          description: Kind of the active absence, when there is one.
        templateAttends:
          type:
            - boolean
            - "null"
          description: What the recurring template says for this day (so a client can offer "reset to template"); omitted without a template.
        templateArrival:
          type:
            - string
            - "null"
          description: Template arrival time (HH:MM, organization timezone).
        templateDeparture:
          type:
            - string
            - "null"
          description: Template departure time (HH:MM, organization timezone).
        changeDeadline:
          type:
            - string
            - "null"
          format: date-time
          description: Instant after which a change of this day is flagged as a late change (RFC 3339, UTC).
      required:
        - date
        - weekday
        - isExpected
        - source
        - isLateChange
        - isFrozen
        - isEditable
        - overrideVersion
    WeekSchedule:
      type: object
      properties:
        childId:
          type: string
          format: uuid
          description: Child.
        weekStart:
          type: string
          format: date
          description: Monday of the week (calendar date, YYYY-MM-DD).
        timezone:
          type: string
          description: Timezone used for wall-clock times (IANA timezone identifier).
          examples:
            - Europe/Belgrade
          maxLength: 64
        version:
          type: integer
          description: Aggregate version = sum of template + override versions for the week; returned as `ETag`.
          minimum: 0
        days:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleDay"
          description: Seven days Monday..Sunday.
          minItems: 7
          maxItems: 7
        changeDeadlineHours:
