        - ANNOUNCEMENT_IMAGE
        - ANNOUNCEMENT_ATTACHMENT
        - DOCUMENT
      description: File purpose.
    UploadAuthorizationRequest:
      type: object
      properties:
        purpose:
          $ref: "#/components/schemas/FilePurpose"
        declaredMime:
          type: string
          description: Declared MIME type (allowlist per purpose; verified after upload).
          pattern: ^[a-z]+/[a-z0-9.+-]+$
          maxLength: 100
        sizeBytes:
          type: integer
          description: Declared size (limits per purpose, e.g. 15 MiB for photos).
          minimum: 1
          maximum: 52428800
        originalFilename:
          type: string
          description: Original filename (sanitised, never used as storage key).
          maxLength: 255
