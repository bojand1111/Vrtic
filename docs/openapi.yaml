            enum:
              - RECEIVED
              - IDENTITY_PENDING
              - IN_PROGRESS
              - COMPLETED
              - REJECTED
            description: Status.
        - name: kind
          in: query
          required: false
          description: Kind filter.
          schema:
            type: string
            enum:
              - ACCESS
              - EXPORT
              - ERASURE
              - RECTIFICATION
            description: Kind.
        - name: sort
          in: query
          required: false
          description: "Sort order (allowlist). Default: `createdAt:desc`."
