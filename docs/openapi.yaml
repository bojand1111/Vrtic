# =============================================================================
#  Vrtić Connect (kindergarten-platform) — REST API contract (OpenAPI 3.1)
#  STATUS: PARTIALLY IMPLEMENTED. Operations marked `x-status: implemented` exist in backend/;
#  `x-status: designed` operations have no route yet. Implementation notes: docs/API.md "Stanje implementacije".
#  Field names mirror docs/database/schema.sql columns in camelCase.
#  Human-readable companion: docs/API.md (Serbian).
# =============================================================================
openapi: 3.1.0
info:
  title: Vrtić Connect API
  version: 1.0.0-design
  summary: REST API contract for the Vrtić Connect kindergarten SaaS platform (kindergarten-platform).
  description: >-
    Design-level contract for the Vrtić Connect platform (parents/guardians, teachers, kindergarten administration, owners and the SaaS
    platform operator).


    **Status.** Every operation carries `x-status`: `implemented` means the route exists in the backend and this contract describes what
    the code actually returns (implementation deviations are stated in the operation description); `designed` means there is no route
    yet (files, photos, consents, privacy requests, health profiles, support access, usage, system logs, attendance offline sync, the
    atomic week update, schedule preview/daily plans, and a few admin operations). Generic implementation conventions (null fields
    omitted, pagination without a cursor on most lists, `Idempotency-Key` accepted but not enforced, unknown query parameters ignored)
    are described once in docs/API.md, section "Stanje implementacije", instead of on every operation.


    **Conventions**

    - Base path `/api/v1`. Tenant scope `/organizations/{organizationId}/...`; global auth under `/auth/*`; profile under `/me`; platform
    operator under `/platform/*`.

    - Two client modes: web admin uses `cookieAuth` (HttpOnly/Secure/SameSite session cookie + `X-CSRF-Token` header + exact `Origin` check
    on mutating requests); mobile uses `bearerAuth` (opaque short-lived access token in `Authorization: Bearer`). Both are listed on every
    authenticated operation.

    - Errors are `application/problem+json` (`Problem` schema) and always carry `requestId`.

    - Lists use cursor pagination: `cursor` (opaque) + `limit` (1..100, default 50) → `{ items, nextCursor }`. Filters and `sort` values are
    explicit allowlists per endpoint.

    - Optimistic concurrency: `GET` of a versioned resource returns `ETag: "<version>"`; mutating `PUT`/`PATCH`/`DELETE` of a versioned
    resource require `If-Match` (`428` when missing, `409` + `Problem.currentVersion` on mismatch). Attendance commands carry
    `expectedVersion` in the body instead.

    - Idempotency: `Idempotency-Key` (UUID) on side-effecting `POST` commands; messages use `clientMessageId`; attendance uses `commandId`.

    - Resources outside the caller's tenant or scope answer `404` (never `403`, which would reveal existence). `403` is used only for an
    operation the caller may not perform on a resource they can see.

    - `429` responses carry `Retry-After`.

    - The API returns codes / i18n keys, never UI text. Instants are RFC 3339 UTC, dates `YYYY-MM-DD`, wall-clock times `HH:MM` in the
    organization IANA timezone.

    - Health data never appears in child list/detail schemas; it is only served by `/children/{childId}/health`. Notification payloads
    contain only i18n keys, arguments and entity ids.
  contact:
    name: Vrtić Connect engineering
    email: engineering@example.test
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  x-audience: internal
servers:
  - url: /api/v1
    description: Versioned REST API (same origin as the admin web app, behind the reverse proxy).
tags:
  - name: Health
    description: Infrastructure liveness/readiness probes served outside `/api/v1`. Unauthenticated, no tenant context, no secrets in the body.
  - name: Auth
    description: >-
      Global authentication and session management (`/auth/*`). Not tenant-scoped. Opaque tokens, rotating refresh with reuse detection,
      per-device sessions, MFA (TOTP) for platform admins, owners and support.
  - name: Me
    description: The authenticated user's own profile, locale, memberships (tenant switcher) and notification inbox.
  - name: Platform
    description: >-
      SaaS operator endpoints (`/platform/*`) for SUPER_ADMIN (and SUPPORT where noted). Require an active `platform_admins` row and an
      MFA-verified session. No child-level data is exposed here; tenant data is reachable only through a time-boxed support access grant.
  - name: Organization
    description: "Tenant root: organization profile and typed settings."
  - name: Structure
    description: Locations (objects) and groups of the kindergarten.
  - name: Members
    description: Employees, invitations, memberships, extra permissions and teacher–group assignments.
  - name: Children
    description: Child profiles (never containing health data), enrollments, guardian links, pickup persons and the child profile photo.
  - name: Child health
    description: >-
      Sensitive health profile (allergies, special needs, medical notes). Separate table, envelope encryption, extra permission, every read
      and write audited with a purpose. Never returned anywhere else.
  - name: Schedules
    description: >-
      Recurring weekly templates with effective dates, day overrides, closure days and computed daily plans. Priority: closure > active
      absence > day override > template > none. History is frozen and never rewritten.
  - name: Absences
    description: Reported absences (SICK/VACATION/OTHER) for one day or a period; immediately visible to teachers; audited and notified.
  - name: Attendance
    description: >-
      Actual presence, separated from the plan. Immutable events, per-day projection with `version`, idempotent commands (`commandId`), row
      locking, offline sync batch. State machine: NOT_ARRIVED → CHECKED_IN → CHECKED_OUT (re-check-in opens a new visit).
  - name: Announcements
    description: >-
      Announcements to organization, location, group or individual guardians. Draft → published → archived; recipient snapshot at publish +
      rights re-check on read; explicit read receipts (push is not proof of reading).
  - name: Calendar
    description: "Organization/location/group events: trips, photo days, performances, holidays, meetings, closures."
  - name: Menus
    description: Daily menus with meal slots BREAKFAST / SNACK_AM / LUNCH / SNACK_PM. Allergen tags are informational, not medical advice.
  - name: Files
    description: >-
      Private file storage: upload authorization → direct upload to private storage → completion → quarantine/scan → READY. No public URLs;
      access only through short-lived signed URLs with the same permissions as the owning entity.
  - name: Photos
    description: >-
      Gallery photos with audience (who may view) and consent (whether distribution is allowed) kept separate. Every recognisable child must
      be tagged manually; publishing requires valid consent for all tagged children; withdrawal blocks further distribution.
  - name: Consent
    description: Versioned consent policies (purpose, locale, wording hash) and guardian decisions with evidence. Not a qualified electronic signature.
  - name: Messaging
    description: >-
      Parent↔Teacher and Parent↔Administration conversations about one child. Participants are managed by the server from guardian links and
      teacher assignments; idempotent sending via `clientMessageId`; unread counts and read positions.
  - name: Compliance
    description: Audit log, reports and privacy (GDPR / Serbian data-protection) requests.
paths:
  /health/live:
    servers:
      - url: /
        description: Unversioned infrastructure endpoints (outside /api/v1).
    get:
      operationId: getHealthLive
      tags:
        - Health
      summary: Liveness probe
      description: Returns `200` as long as the process is running. Used by the container orchestrator; does not touch the database.
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLive"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Process is shutting down.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/UnexpectedError"
      x-priority: P0
      x-status: implemented
      x-roles: []
  /health/ready:
    servers:
      - url: /
        description: Unversioned infrastructure endpoints (outside /api/v1).
    get:
      operationId: getHealthReady
      tags:
        - Health
      summary: Readiness probe
      description: >-
        Checks the database connection (runtime credentials) and that Flyway migrations are current. `503` with `status: DOWN` while not
        ready.
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Not ready (a dependency check is DOWN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"
        default:
          $ref: "#/components/responses/UnexpectedError"
      x-priority: P0
      x-status: implemented
      x-roles: []
  /auth/invitations/{invitationToken}:
    get:
      operationId: previewInvitation
      tags:
        - Auth
      summary: Preview an invitation
      description: >-
        Resolves an invitation token from an e-mail link so the client can show the organization, role and whether registration or login is
        needed. Unknown, expired or revoked tokens → `404`. Heavily rate-limited.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathInvitationToken"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      x-priority: P0
      x-status: implemented
      x-roles: []
  /auth/register:
    post:
      operationId: register
      tags:
        - Auth
      summary: Register via invitation
      description: >-
        Creates the user account for the e-mail bound to the invitation, accepts the invitation (creating the membership / PENDING guardian
        link), marks the e-mail as verified (the invitation token was delivered to that mailbox) and starts a session. Self-registration without an invitation does not exist. Password
        policy violations → `422`; an already registered e-mail → `409 EMAIL_ALREADY_REGISTERED` (the client should log in and call `POST
        /me/invitations/accept`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; session started (cookie or tokens).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      x-priority: P0
      x-status: implemented
      x-roles: []
  /auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Login with e-mail and password
      description: >-
        Verifies credentials (Argon2id) and creates a session for the device. Web clients receive HttpOnly access/refresh cookies plus a
        readable session-bound `vc_csrf` cookie; mobile clients receive `tokens`. Accounts with an enrolled TOTP method get `status:
        MFA_REQUIRED` together with a limited session (cookies or tokens): until `POST /auth/mfa/totp/verify` succeeds only `GET
        /auth/session`, `POST /auth/logout`, `POST /auth/mfa/totp/verify`, `GET /me`, `GET /me/memberships` and `PUT /me/locale` work, every
        other route answers `403 MFA_REQUIRED`. No `mfaChallengeToken` is issued. `mfaEnrollmentRequired: true` means MFA is mandatory for
        the account (OWNER membership) but not enrolled yet; tenant and platform routes then answer `403 MFA_ENROLLMENT_REQUIRED` until
        `POST /auth/mfa/totp/confirm` succeeds. The client kind may be sent as `device.clientKind` or as a top-level `clientKind`; a missing
        or unknown client kind, like missing credentials, answers the generic `401 INVALID_CREDENTIALS` (not `422`). An unverified e-mail
        answers `200` with `status: EMAIL_VERIFICATION_REQUIRED` and no session. Failed attempts are counted per e-mail hash and IP;
        generic `401 INVALID_CREDENTIALS` is returned whether the account exists or not. Brute force: every attempt is recorded in
        `login_attempts`; after 10 failures for the same e-mail hash within 15 minutes (or while `locked_until` is in the future) the answer
        is `429` with `Retry-After`, identical for unknown accounts; 20 requests per client IP per minute across `/auth/*`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/NotImplemented"
        default:
          $ref: "#/components/responses/UnexpectedError"
      x-priority: P0
      x-status: implemented
      x-roles: []
  /auth/refresh:
    post:
      operationId: refreshSession
      tags:
        - Auth
      summary: Rotate the refresh token
      description: >-
        Atomically consumes the presented Bearer refresh token and issues a new access/refresh pair. Reuse of an already consumed token revokes
        the whole session family and returns `401 REFRESH_REUSE_DETECTED`. Idle expiry 7 days, absolute 30 days. Web clients may present the
        `vc_refresh` HttpOnly cookie without a request body and receive rotated HttpOnly `vc_access` and `vc_refresh` cookies; cookie mode
        also requires the session-bound `X-CSRF-Token` and exact configured `Origin`.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/NotImplemented"
        default:
          $ref: "#/components/responses/UnexpectedError"
      x-priority: P0
      x-status: implemented
      x-roles: []
  /auth/session:
    get:
      operationId: getCurrentSession
      tags:
        - Auth
      summary: Current session (web bootstrap)
      description: >-
        Returns the current session summary (user, session, client kind, MFA state, CSRF token in cookie mode, membership summary) so the
        web admin can restore its state after a page load without a second round-trip. `401` (Problem) when there is no valid session. The
        implementation returns `user` (with the ACTIVE membership summary inside `user.memberships`), the session identifiers and the MFA
        state; there is no top-level `memberships` array and no `csrfToken` in the body (the CSRF token is delivered in the readable `vc_csrf`
        cookie). Allowed for a session that still has to pass MFA verification.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/NotImplemented"
        default:
          $ref: "#/components/responses/UnexpectedError"
      x-priority: P0
      x-status: implemented
      x-roles:
        - OWNER
        - ADMIN
        - TEACHER
        - PARENT
        - SUPER_ADMIN
        - SUPPORT
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Logout current session
      description: >-
        Revokes the current session (`USER_LOGOUT`), its access and refresh tokens and clears web cookies. Cookie mode requires the
        session-bound `X-CSRF-Token` and exact configured `Origin`; bearer mode does not.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: No content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      x-priority: P0
      x-status: implemented
      x-roles:
        - OWNER
        - ADMIN
        - TEACHER
        - PARENT
        - SUPER_ADMIN
        - SUPPORT
  /auth/logout-all:
    post:
      operationId: logoutAll
      tags:
        - Auth
      summary: Logout every session of the user
      description: Revokes all sessions of the caller (`LOGOUT_ALL`) including the current one. Requires recent re-authentication.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: No content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      x-priority: P0
      x-status: implemented
      x-roles:
        - OWNER
        - ADMIN
        - TEACHER
        - PARENT
        - SUPER_ADMIN
        - SUPPORT
      x-requires-reauthentication: true
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - Auth
      summary: List active sessions
      description: Lists the caller's non-revoked sessions (device list) with the current one flagged.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      x-priority: P0
      x-status: implemented
      x-roles:
        - OWNER
        - ADMIN
        - TEACHER
        - PARENT
        - SUPER_ADMIN
        - SUPPORT
  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      tags:
        - Auth
      summary: Revoke one session
      description: Revokes a specific session of the caller (remote logout of a device). Sessions of other users → `404`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathSessionId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: No content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      x-priority: P0
      x-status: implemented
      x-roles:
        - OWNER
        - ADMIN
        - TEACHER
        - PARENT
        - SUPER_ADMIN
        - SUPPORT
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags:
        - Auth
      summary: Verify e-mail address
      description: Consumes an e-mail verification token (24 h validity, single use). Invalid/expired → `404 TOKEN_INVALID`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "204":
          description: No content.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      x-priority: P0
      x-status: implemented
      x-roles: []
  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags:
        - Auth
      summary: Resend verification e-mail
      description: >-
        Sends a new verification link when an account with this e-mail exists and is still unverified. Unauthenticated (an
        unverified account cannot hold a session). Rate-limited (max 3 per hour, E02-B13). Always `202`, identical regardless of account existence.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted (e-mail queued).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      x-priority: P0
      x-status: implemented
      x-roles:
        - OWNER
        - ADMIN
        - TEACHER
        - PARENT
        - SUPER_ADMIN
        - SUPPORT
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags:
        - Auth
      summary: Request a password reset link
      description: >-
        Sends a reset link (15 min validity) if the account exists. The response is always `202` and identical regardless of account
        existence. Rate-limited per e-mail hash and IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      x-priority: P0
      x-status: implemented
      x-roles: []
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags:
        - Auth
      summary: Reset password with a token
      description: >-
        Sets a new password using a reset token, revokes all sessions (`PASSWORD_CHANGED`) and consumes the token. Invalid/expired → `404
        TOKEN_INVALID`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: No content.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      x-priority: P0
      x-status: implemented
      x-roles: []
  /auth/reauthenticate:
    post:
      operationId: reauthenticate
      tags:
        - Auth
