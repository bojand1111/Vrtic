          type: array
          items:
            type: integer
            description: ISO weekday 1=Mon..7=Sun.
            minimum: 1
            maximum: 7
          description: Working weekdays.
          minItems: 1
          maxItems: 7
          uniqueItems: true
        offlineCacheTtlHours:
          type: integer
          description: Mobile offline snapshot validity.
          minimum: 1
          maximum: 48
