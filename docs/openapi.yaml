components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: vc_access
      description: >-
        Web admin session cookie (HttpOnly, Secure, SameSite=Lax). Mutating requests must also send `X-CSRF-Token` and an exact `Origin`
        matching the configured web origin. Tokens are never stored in localStorage.
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Mobile clients send the opaque short-lived access token (10 min) as `Authorization: Bearer <token>`. Tokens live in
        Keychain/Keystore; refresh is single-flight with rotation and reuse detection.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor returned as `nextCursor` by a previous page. Omit for the first page.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Entity tag from the last `GET` (`"<version>"`). Missing → `428`; mismatch → `409` with `currentVersion`.
      schema:
        type: string
        pattern: ^"[0-9]+"$
        examples:
          - "\"3\""
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated UUID. Replays with the same key and identical body return the original response; same key with a different body →
        `422` (`IDEMPOTENCY_KEY_REUSED`). Keys expire after 24 h.
      schema:
        type: string
        format: uuid
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional client-generated UUID enabling safe retries (same semantics as on required endpoints).
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required in `cookieAuth` mode for every mutating request (double-submit token issued at login). Ignored in `bearerAuth` mode.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    Purpose:
      name: purpose
      in: query
      required: true
      description: Reason for accessing health data; recorded in the audit log.
      schema:
        $ref: "#/components/schemas/HealthAccessPurpose"
    PathOrganizationId:
      name: organizationId
      in: path
      required: true
      description: Organization (tenant) id.
      schema:
        type: string
        format: uuid
    PathSessionId:
      name: sessionId
      in: path
      required: true
      description: Session id.
      schema:
        type: string
        format: uuid
    PathPushTokenId:
