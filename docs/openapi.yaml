        organizationId:
          type:
            - string
            - "null"
          format: uuid
          description: Organization.
        requesterUserId:
          type: string
          format: uuid
          description: Requester.
        subjectType:
          type: string
          enum:
            - USER
            - CHILD
          description: Subject type.
        subjectId:
          type: string
          format: uuid
          description: Subject id.
        kind:
          type: string
          enum:
            - ACCESS
            - EXPORT
            - ERASURE
            - RECTIFICATION
          description: Kind.
        status:
          type: string
          enum:
            - RECEIVED
            - IDENTITY_PENDING
            - IN_PROGRESS
            - COMPLETED
            - REJECTED
          description: Status.
        identityVerifiedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Identity verified (RFC 3339 instant, UTC).
        rejectionReason:
          type:
            - string
            - "null"
          description: Rejection reason code.
        completedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Completed (RFC 3339 instant, UTC).
        exportFileId:
          type:
            - string
            - "null"
          format: uuid
          description: Export file (EXPORT kind, short-lived).
        createdAt:
          type: string
          format: date-time
          description: Created (RFC 3339 instant, UTC).
        updatedAt:
          type: string
          format: date-time
          description: Updated (RFC 3339 instant, UTC).
      required:
        - id
        - organizationId
        - requesterUserId
        - subjectType
        - subjectId
        - kind
        - status
        - createdAt
        - updatedAt
    PrivacyRequestCreate:
      type: object
      properties:
        subjectType:
          type: string
          enum:
            - USER
            - CHILD
          description: Subject type.
        subjectId:
          type: string
          format: uuid
          description: "Own user id, or a child the caller is a confirmed guardian of (staff: any child in tenant)."
        kind:
          type: string
          enum:
            - ACCESS
            - EXPORT
            - ERASURE
            - RECTIFICATION
          description: Kind.
        note:
          type: string
          description: Free-text note for the operator.
          maxLength: 2000
      required:
        - subjectType
        - subjectId
        - kind
      additionalProperties: false
    DashboardSummary:
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
          description: Organization.
        date:
          type: string
          format: date
          description: Date in organization timezone (calendar date, YYYY-MM-DD).
        timezone:
          type: string
          description: Timezone (IANA timezone identifier).
          examples:
            - Europe/Belgrade
          maxLength: 64
        counters:
          $ref: "#/components/schemas/DailyOverviewCounters"
        childrenActive:
          type: integer
          description: Active enrolled children.
          minimum: 0
        staffActive:
          type: integer
          description: Active staff.
          minimum: 0
        guardiansPending:
          type: integer
          description: Guardian links awaiting confirmation.
          minimum: 0
        invitationsPending:
          type: integer
          description: Pending invitations.
          minimum: 0
        absencesToday:
          type: integer
          description: Active absences covering the date.
          minimum: 0
        lateScheduleChangesToday:
          type: integer
          description: Late schedule changes for the date.
          minimum: 0
        locations:
          type: array
          items:
            type: object
            properties:
              locationId:
                type: string
                format: uuid
                description: Location.
              name:
                type: string
                description: Name.
              groupsCount:
                type: integer
                description: Groups.
                minimum: 0
              counters:
                $ref: "#/components/schemas/DailyOverviewCounters"
            required:
              - locationId
              - name
              - groupsCount
              - counters
          description: Per location.
        groups:
          type: array
          items:
            type: object
            properties:
              groupId:
                type: string
                format: uuid
                description: Group.
              locationId:
                type: string
                format: uuid
                description: Location.
              name:
                type: string
                description: Name.
              counters:
                $ref: "#/components/schemas/DailyOverviewCounters"
            required:
              - groupId
              - locationId
              - name
              - counters
          description: Per group.
        latestAnnouncements:
          type: array
          items:
            $ref: "#/components/schemas/DashboardAnnouncement"
          description: Up to 5 latest published, unexpired announcements (reduced shape).
          maxItems: 5
        upcomingEvents:
          type: array
          items:
            $ref: "#/components/schemas/DashboardEvent"
          description: Up to 5 calendar events ending on or after `date` (reduced shape).
          maxItems: 5
        subscription:
          oneOf:
            - $ref: "#/components/schemas/Subscription"
            - type: "null"
          description: Not returned by the current implementation.
        generatedAt:
          type: string
          format: date-time
          description: Generated (RFC 3339 instant, UTC).
      required:
        - organizationId
        - date
        - timezone
        - counters
        - childrenActive
        - staffActive
        - guardiansPending
        - invitationsPending
        - absencesToday
        - lateScheduleChangesToday
        - locations
        - groups
        - latestAnnouncements
        - upcomingEvents
        - generatedAt
    DashboardAnnouncement:
      type: object
      description: Reduced announcement item of the dashboard.
      properties:
        id:
          type: string
          format: uuid
          description: Announcement id.
        title:
          type: string
          description: Title.
        status:
          type: string
          enum:
            - PUBLISHED
          description: Status (always PUBLISHED here).
        publishedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Published (RFC 3339 instant, UTC); omitted when null.
      required:
        - id
        - title
        - status
    DashboardEvent:
      type: object
      description: Reduced calendar event item of the dashboard.
      properties:
        id:
          type: string
          format: uuid
          description: Event id.
        kind:
          type: string
          description: Event kind (same values as `CalendarEvent.kind`).
        title:
          type: string
          description: Title.
        allDay:
          type: boolean
          description: All-day event.
        startsOn:
          type: string
          format: date
          description: First day (calendar date, YYYY-MM-DD).
        endsOn:
          type: string
          format: date
          description: Last day (calendar date, YYYY-MM-DD).
        startsAt:
          type:
            - string
            - "null"
          format: date-time
          description: Start instant for timed events (RFC 3339, UTC); omitted for all-day events.
      required:
        - id
        - kind
        - title
        - allDay
        - startsOn
        - endsOn
    HealthLive:
      type: object
      properties:
        status:
          type: string
          enum:
            - UP
          description: Liveness.
        timestamp:
          type: string
          format: date-time
          description: Server time (RFC 3339 instant, UTC). Not returned by the current implementation.
      required:
        - status
    HealthReady:
      type: object
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
          description: Readiness.
        timestamp:
          type: string
          format: date-time
          description: Server time (RFC 3339 instant, UTC). Not returned by the current implementation.
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
              - UP
              - DOWN
            description: Check status.
          description: >-
            Dependency checks as a map of check name (`database`, `migrations`) to `UP`/`DOWN`, e.g. `{"database": "UP", "migrations":
            "UP"}`. No connection strings or versions are exposed.
      required:
        - status
        - checks
