        isPlatformAdmin:
          type: boolean
          description: True for active platform (SUPER_ADMIN) users.
        lastLoginAt:
          type:
            - string
            - "null"
          format: date-time
          description: Last successful login (RFC 3339 instant, UTC).
        createdAt:
          type: string
          format: date-time
          description: Created (RFC 3339 instant, UTC).
      required:
        - id
        - email
        - givenName
        - familyName
        - preferredLocale
        - status
        - mfaEnabled
        - isPlatformAdmin
        - createdAt
    LocaleUpdate:
      type: object
      properties:
        preferredLocale:
          $ref: "#/components/schemas/Locale"
      required:
        - preferredLocale
      additionalProperties: false
    OrganizationRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Organization id.
        slug:
          type: string
          description: URL-safe unique slug.
        name:
          type: string
          description: Display name.
        timezone:
          type: string
          description: Organization timezone (IANA timezone identifier).
