          type:
            - integer
            - "null"
          description: Width.
        height:
          type:
            - integer
            - "null"
          description: Height.
        sizeBytes:
          type:
            - integer
            - "null"
          description: Size.
      required:
        - variant
    File:
      type: object
      description: Metadata only. Bytes are in private storage; no public URLs exist.
      properties:
        id:
          type: string
          format: uuid
