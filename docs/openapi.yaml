    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Notification id.
        organizationId:
          type:
            - string
            - "null"
          format: uuid
          description: Tenant (null for global/security notifications).
        membershipId:
          type:
            - string
            - "null"
          format: uuid
          description: Membership the notification targets.
        kind:
          type: string
          enum:
            - ANNOUNCEMENT
            - SCHEDULE_CHANGE
            - ABSENCE
            - ATTENDANCE
            - CALENDAR_EVENT
            - URGENT
            - CONSENT_REQUEST
            - MESSAGE
            - SECURITY
            - SYSTEM
          description: Notification kind.
        titleKey:
          type: string
          description: i18n key rendered by the client in the user locale.
          examples:
            - notification.announcement.published
        titleArgs:
          type: object
          description: "i18n arguments: only ids, counts, dates and non-sensitive names. Never health data or message bodies."
          properties: {}
          additionalProperties:
