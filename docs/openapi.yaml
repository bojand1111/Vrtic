          type: string
          description: Pre-signed PUT URL to private storage (short-lived; never logged).
          format: uri
        method:
          type: string
          enum:
            - PUT
          description: HTTP method for the upload.
        requiredHeaders:
          type: object
          description: Headers the client must send with the upload (e.g. Content-Type).
          properties: {}
          additionalProperties:
            type: string
        maxSizeBytes:
          type: integer
          description: Max accepted size.
          minimum: 1
        expiresAt:
          type: string
          format: date-time
          description: Authorization expiry (RFC 3339 instant, UTC).
      required:
        - fileId
        - uploadUrl
        - method
        - requiredHeaders
        - maxSizeBytes
        - expiresAt
    FileVariant:
