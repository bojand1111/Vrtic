    DailyOverviewCounters:
      type: object
      description: Same definition is used by backend, mobile and web.
      properties:
        expected:
          type: integer
          description: Expected = present + departed + absent + notArrived.
          minimum: 0
        present:
          type: integer
          description: Expected and currently CHECKED_IN.
          minimum: 0
        departed:
          type: integer
          description: Expected and CHECKED_OUT.
          minimum: 0
        absent:
          type: integer
          description: Expected with absence context and not checked in.
          minimum: 0
        notArrived:
          type: integer
          description: Expected, NOT_ARRIVED, no absence.
          minimum: 0
        late:
          type: integer
          description: Expected, NOT_ARRIVED past arrival + grace (subset of notArrived) or checked in late.
          minimum: 0
        unscheduledPresent:
          type: integer
          description: Not expected but CHECKED_IN (counted separately, not in `expected`).
          minimum: 0
        physicallyPresent:
          type: integer
          description: present + unscheduledPresent.
          minimum: 0
      required:
        - expected
        - present
        - departed
        - absent
        - notArrived
        - late
        - unscheduledPresent
        - physicallyPresent
    DailyOverviewChild:
      type: object
      properties:
        childId:
          type: string
          format: uuid
          description: Child.
        givenName:
          type: string
          description: Given name.
        familyName:
          type: string
          description: Family name.
        photoFileId:
          type:
            - string
            - "null"
          format: uuid
          description: Profile photo.
        hasCriticalHealthAlert:
          type: boolean
          description: Indicator only.
        isExpected:
          type: boolean
          description: Expected.
        expectedArrival:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Expected arrival (wall-clock HH:MM in the organization timezone).
          examples:
            - "08:00"
        expectedDeparture:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Expected departure (wall-clock HH:MM in the organization timezone).
          examples:
            - "08:00"
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        absenceKind:
          oneOf:
            - $ref: "#/components/schemas/AbsenceKind"
            - type: "null"
        overviewState:
          type: string
          enum:
            - PRESENT
            - DEPARTED
            - ABSENT
            - NOT_ARRIVED
            - UNSCHEDULED_PRESENT
            - NOT_EXPECTED
          description: Bucket used by the counters.
        isLate:
          type: boolean
          description: Late.
        isUnscheduled:
          type: boolean
          description: Unscheduled.
        firstCheckInAt:
          type:
            - string
            - "null"
          format: date-time
          description: First check-in (RFC 3339 instant, UTC).
        lastCheckOutAt:
          type:
            - string
            - "null"
          format: date-time
          description: Last check-out (RFC 3339 instant, UTC).
        version:
          type: integer
          description: Attendance day version for the next command.
          minimum: 0
        pickupPersonsCount:
          type: integer
          description: Active pickup persons.
          minimum: 0
      required:
        - childId
        - givenName
        - familyName
        - isExpected
        - status
        - overviewState
        - isLate
        - isUnscheduled
        - version
    DailyOverview:
      type: object
