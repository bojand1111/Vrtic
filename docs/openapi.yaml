        - id
        - sequenceNo
        - checkInAt
        - checkInEventId
    AttendanceDay:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Attendance day id.
        childId:
          type: string
          format: uuid
          description: Child.
        groupId:
          type:
            - string
            - "null"
          format: uuid
          description: Group.
        attendanceDate:
          type: string
          format: date
          description: Date (calendar date, YYYY-MM-DD).
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        absenceKind:
          oneOf:
            - $ref: "#/components/schemas/AbsenceKind"
            - type: "null"
        isExpected:
          type: boolean
          description: Expected per daily plan.
        expectedArrival:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Expected arrival (wall-clock HH:MM in the organization timezone).
          examples:
            - "08:00"
        expectedDeparture:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Expected departure (wall-clock HH:MM in the organization timezone).
          examples:
            - "08:00"
        isUnscheduled:
          type: boolean
          description: Present although not expected.
        isLate:
          type: boolean
          description: First check-in after expected arrival + grace.
        firstCheckInAt:
          type:
            - string
            - "null"
          format: date-time
          description: First check-in (RFC 3339 instant, UTC).
        lastCheckOutAt:
          type:
            - string
            - "null"
          format: date-time
          description: Last check-out (RFC 3339 instant, UTC).
        openVisitId:
          type:
            - string
            - "null"
          format: uuid
