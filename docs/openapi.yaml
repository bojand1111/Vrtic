          type: string
          description: Note.
          maxLength: 200
      required:
        - commandId
        - childId
        - type
        - attendanceDate
        - expectedVersion
        - occurredAt
      additionalProperties: false
    SyncBatchRequest:
      type: object
      description: >-
        Offline queue replay. Each command is evaluated independently; the batch never fails as a whole. Rights are re-checked at sync time
        (a revoked teacher gets `REJECTED`).
      properties:
        deviceId:
          type: string
          description: Device id.
          minLength: 1
          maxLength: 128
        snapshotGeneratedAt:
          type: string
          format: date-time
          description: When the offline snapshot was taken (rejected when older than offlineCacheTtlHours) (RFC 3339 instant, UTC).
        commands:
          type: array
          items:
            $ref: "#/components/schemas/SyncCommand"
          description: Commands in device order; processed sequentially per child.
          minItems: 1
          maxItems: 200
      required:
        - deviceId
        - snapshotGeneratedAt
        - commands
      additionalProperties: false
    SyncCommandResult:
      type: object
      description: Clients remove a command from the queue only after ACCEPTED/DUPLICATE; CONFLICT requires user resolution (no last-write-wins).
      properties:
        commandId:
          type: string
          format: uuid
          description: Command id.
        outcome:
          type: string
          enum:
            - ACCEPTED
            - DUPLICATE
            - REJECTED
            - CONFLICT
          description: Outcome.
        code:
          type:
            - string
            - "null"
          description: >-
            Reason code for REJECTED/CONFLICT (`VERSION_MISMATCH`, `NO_OPEN_VISIT`, `ALREADY_CHECKED_IN`, `FORBIDDEN`, `NOT_FOUND`,
            `SNAPSHOT_EXPIRED`, `OCCURRED_AT_INVALID`).
        currentVersion:
          type:
            - integer
            - "null"
          description: Server version after processing (or current on CONFLICT).
          minimum: 0
        attendanceDay:
          oneOf:
            - $ref: "#/components/schemas/AttendanceDay"
            - type: "null"
      required:
        - commandId
        - outcome
        - code
        - currentVersion
        - attendanceDay
    SyncBatchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SyncCommandResult"
          description: One result per command, same order.
        processedAt:
          type: string
          format: date-time
          description: Processed (RFC 3339 instant, UTC).
      required:
