components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: vc_access
      description: >-
        Web admin session cookie (HttpOnly, Secure, SameSite=Lax). Mutating requests must also send `X-CSRF-Token` and an exact `Origin`
        matching the configured web origin. Tokens are never stored in localStorage.
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Mobile clients send the opaque short-lived access token (10 min) as `Authorization: Bearer <token>`. Tokens live in
        Keychain/Keystore; refresh is single-flight with rotation and reuse detection.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor returned as `nextCursor` by a previous page. Omit for the first page.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Entity tag from the last `GET` (`"<version>"`). Missing → `428`; mismatch → `409` with `currentVersion`.
      schema:
        type: string
        pattern: ^"[0-9]+"$
        examples:
          - "\"3\""
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated UUID. Replays with the same key and identical body return the original response; same key with a different body →
        `422` (`IDEMPOTENCY_KEY_REUSED`). Keys expire after 24 h.
      schema:
        type: string
        format: uuid
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional client-generated UUID enabling safe retries (same semantics as on required endpoints).
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required in `cookieAuth` mode for every mutating request (double-submit token issued at login). Ignored in `bearerAuth` mode.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    Purpose:
      name: purpose
      in: query
      required: true
      description: Reason for accessing health data; recorded in the audit log.
      schema:
        $ref: "#/components/schemas/HealthAccessPurpose"
    PathOrganizationId:
      name: organizationId
      in: path
      required: true
      description: Organization (tenant) id.
      schema:
        type: string
        format: uuid
    PathSessionId:
      name: sessionId
      in: path
      required: true
      description: Session id.
      schema:
        type: string
        format: uuid
    PathPushTokenId:
      name: pushTokenId
      in: path
      required: true
      description: Device push token registration id.
      schema:
        type: string
        format: uuid
    PathGrantId:
      name: grantId
      in: path
      required: true
      description: Support access grant id.
      schema:
        type: string
        format: uuid
    PathLocationId:
      name: locationId
      in: path
      required: true
      description: Location id.
      schema:
        type: string
        format: uuid
    PathGroupId:
      name: groupId
      in: path
      required: true
      description: Group id.
      schema:
        type: string
        format: uuid
    PathEmployeeId:
      name: employeeId
      in: path
      required: true
      description: Employee id.
      schema:
        type: string
        format: uuid
    PathInvitationId:
      name: invitationId
      in: path
      required: true
      description: Invitation id.
      schema:
        type: string
        format: uuid
    PathMembershipId:
      name: membershipId
      in: path
      required: true
      description: Organization membership id.
      schema:
        type: string
        format: uuid
    PathAssignmentId:
      name: assignmentId
      in: path
      required: true
      description: Group–teacher assignment id.
      schema:
        type: string
        format: uuid
    PathChildId:
      name: childId
      in: path
      required: true
      description: Child id.
      schema:
        type: string
        format: uuid
    PathEnrollmentId:
      name: enrollmentId
      in: path
      required: true
      description: Enrollment id.
      schema:
        type: string
        format: uuid
    PathGuardianId:
      name: guardianId
      in: path
      required: true
      description: Guardian link id.
      schema:
        type: string
        format: uuid
    PathPickupPersonId:
      name: pickupPersonId
      in: path
      required: true
      description: Pickup person id.
      schema:
        type: string
        format: uuid
    PathClosureDayId:
      name: closureDayId
      in: path
      required: true
      description: Closure day id.
      schema:
        type: string
        format: uuid
    PathAbsenceId:
      name: absenceId
      in: path
      required: true
      description: Absence id.
      schema:
        type: string
        format: uuid
    PathAnnouncementId:
      name: announcementId
      in: path
      required: true
      description: Announcement id.
      schema:
        type: string
        format: uuid
    PathEventId:
      name: eventId
      in: path
      required: true
      description: Calendar event id.
      schema:
        type: string
        format: uuid
    PathMenuDayId:
      name: menuDayId
      in: path
      required: true
      description: Menu day id.
      schema:
        type: string
        format: uuid
    PathFileId:
      name: fileId
      in: path
      required: true
      description: File id.
      schema:
        type: string
        format: uuid
    PathPhotoId:
      name: photoId
      in: path
      required: true
      description: Photo id.
      schema:
        type: string
        format: uuid
    PathDecisionId:
      name: decisionId
      in: path
      required: true
      description: Consent decision id.
      schema:
        type: string
        format: uuid
    PathConversationId:
      name: conversationId
      in: path
      required: true
      description: Conversation id.
      schema:
        type: string
        format: uuid
    PathPrivacyRequestId:
      name: privacyRequestId
      in: path
      required: true
      description: Privacy request id.
      schema:
        type: string
        format: uuid
    PathFlagKey:
      name: flagKey
      in: path
      required: true
      description: Feature flag key.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_]{2,63}$
    PathDate:
      name: date
      in: path
      required: true
      description: Calendar date (YYYY-MM-DD).
      schema:
        type: string
        format: date
    PathInvitationToken:
      name: invitationToken
      in: path
      required: true
      description: Raw invitation token from the invitation e-mail link (only its SHA-256 hash is stored).
      schema:
        type: string
        minLength: 32
        maxLength: 256
  headers:
    ETag:
      description: Entity tag carrying the current `version` of the resource, e.g. `"3"`. Send it back as `If-Match`.
      schema:
        type: string
        pattern: ^"[0-9]+"$
    RetryAfter:
      description: Seconds the client should wait before retrying.
      schema:
        type: integer
        minimum: 1
    RateLimitLimit:
      description: Request quota for the current window.
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      description: Remaining requests in the current window.
      schema:
        type: integer
        minimum: 0
  responses:
    Unauthorized:
      description: >-
        Missing, expired or revoked credentials. Web clients must re-login; mobile clients should attempt a single-flight refresh once and
        re-login on a second `401`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            expired:
              value:
                type: https://api.vrtic.example.test/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: ACCESS_TOKEN_EXPIRED
                instance: /api/v1/me
                requestId: 01J8Q3Z9V6X5N8J2Q4W7R1T0YA
    Forbidden:
      description: >-
        Authenticated, but the operation is not allowed for the caller's role/permissions on a resource the caller can see (e.g. TEACHER
        trying to publish an announcement). Never used to hide existence — see `404`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            forbidden:
              value:
                type: https://api.vrtic.example.test/problems/forbidden
                title: Forbidden
                status: 403
                detail: PERMISSION_REQUIRED
                errors:
                  - field: permission
                    code: CHILD_HEALTH_READ
                    message: permission.required
                instance: /api/v1/organizations/6f2b.../children/9c1d.../health
                requestId: 01J8Q3Z9V6X5N8J2Q4W7R1T0YB
    NotFound:
      description: >-
        The resource does not exist **or** is outside the caller's tenant / scope (other organization, child without a confirmed guardian
        link, group outside the teacher's active assignment). The response is identical in both cases.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            notFound:
              value:
                type: https://api.vrtic.example.test/problems/not-found
                title: Not Found
                status: 404
                detail: RESOURCE_NOT_FOUND
                instance: /api/v1/organizations/6f2b.../children/9c1d...
                requestId: 01J8Q3Z9V6X5N8J2Q4W7R1T0YC
    Conflict:
      description: >-
        Business-rule conflict (overlapping period, duplicate, invalid state transition, closed conversation, ...). `detail` carries a
        stable code.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            overlap:
              value:
                type: https://api.vrtic.example.test/problems/conflict
                title: Conflict
                status: 409
                detail: ABSENCE_OVERLAP
                errors:
                  - field: dateFrom
                    code: OVERLAPS_EXISTING
                    message: absence.overlap
                conflictingIds:
                  - 3f0a1c62-1b7e-4e5d-9d4c-2c1e1b4d5f60
                instance: /api/v1/organizations/6f2b.../absences
                requestId: 01J8Q3Z9V6X5N8J2Q4W7R1T0YD
    VersionConflict:
      description: >-
        `If-Match` does not match the current `version` (someone else changed the resource) or the state transition is not allowed.
        `currentVersion` tells the client which version to reload.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            staleVersion:
              value:
                type: https://api.vrtic.example.test/problems/version-conflict
                title: Conflict
                status: 409
                detail: VERSION_MISMATCH
                currentVersion: 7
                instance: /api/v1/organizations/6f2b.../children/9c1d.../schedule/week
                requestId: 01J8Q3Z9V6X5N8J2Q4W7R1T0YE
    ValidationError:
      description: Request is well-formed but semantically invalid. `errors[]` lists field-level codes (i18n keys, no UI text).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            validation:
              value:
                type: https://api.vrtic.example.test/problems/validation
                title: Unprocessable Content
                status: 422
                detail: VALIDATION_FAILED
                errors:
                  - field: dateOfBirth
                    code: DATE_IN_FUTURE
                    message: validation.date.future
                instance: /api/v1/organizations/6f2b.../children
                requestId: 01J8Q3Z9V6X5N8J2Q4W7R1T0YF
    PreconditionRequired:
      description: The operation targets a versioned resource but `If-Match` is missing.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            missing:
              value:
                type: https://api.vrtic.example.test/problems/precondition-required
                title: Precondition Required
                status: 428
                detail: IF_MATCH_REQUIRED
                instance: /api/v1/organizations/6f2b.../children/9c1d...
                requestId: 01J8Q3Z9V6X5N8J2Q4W7R1T0YG
    AttendanceConflict:
      description: >-
        Attendance command rejected: `VERSION_MISMATCH` (client `expectedVersion` is stale — reload the day, `currentVersion` is returned),
        `ALREADY_CHECKED_IN`, `NO_OPEN_VISIT` or `DAY_LOCKED` (date older than the correction window). The command is NOT applied.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            versionMismatch:
              value:
                type: https://api.vrtic.example.test/problems/version-conflict
                title: Conflict
                status: 409
                detail: VERSION_MISMATCH
                currentVersion: 4
                errors:
                  - field: expectedVersion
                    code: STALE
                    message: attendance.version.stale
                instance: /api/v1/organizations/6f2b.../children/9c1d.../attendance/check-in
                requestId: 01J8Q3Z9V6X5N8J2Q4W7R1T0YK
            noOpenVisit:
              value:
                type: https://api.vrtic.example.test/problems/conflict
                title: Conflict
                status: 409
                detail: NO_OPEN_VISIT
                instance: /api/v1/organizations/6f2b.../children/9c1d.../attendance/check-out
                requestId: 01J8Q3Z9V6X5N8J2Q4W7R1T0YL
    TooManyRequests:
      description: >-
        Rate limit exceeded (per IP, per account and per tenant buckets; stricter buckets on `/auth/*`). Retry after the indicated number of
        seconds.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            limited:
              value:
                type: https://api.vrtic.example.test/problems/rate-limited
                title: Too Many Requests
                status: 429
                detail: RATE_LIMITED
                instance: /api/v1/auth/login
                requestId: 01J8Q3Z9V6X5N8J2Q4W7R1T0YH
    NotImplemented:
      description: Returned by the current skeleton for auth stubs that intentionally do not issue tokens yet (EPIC 02 pending).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            stub:
              value:
                type: https://api.vrtic.example.test/problems/not-implemented
                title: Not Implemented
                status: 501
                detail: AUTH_NOT_IMPLEMENTED
                instance: /api/v1/auth/login
                requestId: 01J8Q3Z9V6X5N8J2Q4W7R1T0YJ
    UnexpectedError:
      description: >-
        Any other error (including `500`). The body never contains stack traces, SQL, tokens or personal data — only the `requestId` to
        correlate with sanitized server logs.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. Media type `application/problem+json`.
      properties:
        type:
          type: string
          description: URI reference identifying the problem type (stable, documented).
          format: uri
          examples:
            - https://api.vrtic.example.test/problems/validation
        title:
          type: string
          description: Short, human-readable summary of the problem type (English, not localized; clients render by `detail`/`errors[].code`).
        status:
          type: integer
          description: HTTP status code.
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Stable machine-readable code for this occurrence (e.g. `VALIDATION_FAILED`, `ABSENCE_OVERLAP`, `VERSION_MISMATCH`).
          pattern: ^[A-Z][A-Z0-9_]{2,63}$
        instance:
          type: string
          description: Request path that produced the problem.
          examples:
            - /api/v1/organizations/6f2b.../absences
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
          description: Field-level details (present on `422`, may appear on `409`).
        requestId:
          type: string
          description: Correlation id also emitted in the `X-Request-Id` response header and in server logs.
          minLength: 8
          maxLength: 64
        currentVersion:
          type: integer
          description: "Present on `409 VERSION_MISMATCH`: the resource version currently stored."
          minimum: 0
        conflictingIds:
          type: array
          items:
            type: string
            format: uuid
            description: Id of a conflicting entity.
          description: Present on business conflicts such as overlaps.
        retryAfterSeconds:
          type: integer
          description: Present on `429`.
          minimum: 1
      required:
        - type
        - title
        - status
        - requestId
    ProblemError:
      type: object
      properties:
        field:
          type: string
          description: JSON pointer-ish path of the offending field (`dateFrom`, `days[2].arrivalTime`) or a logical name (`permission`).
        code:
          type: string
          description: Stable validation/business code, e.g. `REQUIRED`, `OUT_OF_RANGE`, `OVERLAPS_EXISTING`.
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        message:
          type: string
          description: i18n message key (never rendered UI text), e.g. `validation.required`.
      required:
        - field
        - code
        - message
    Locale:
      type: string
      enum:
        - sr-Latn
        - sr-Cyrl
        - en
      description: Supported UI locales.
    MembershipRole:
      type: string
      enum:
        - OWNER
        - ADMIN
        - TEACHER
        - PARENT
      description: Role held on an organization membership (roles live on the membership, not on the user).
    Permission:
      type: string
      enum:
        - CHILD_HEALTH_READ
        - CHILD_HEALTH_WRITE
        - ATTENDANCE_CORRECT
        - ANNOUNCEMENT_PUBLISH
        - PHOTO_PUBLISH
        - BILLING_MANAGE
        - MEMBER_MANAGE
        - REPORT_EXPORT
      description: Fine-grained permission on top of a role (`membership_permissions`).
    ClientKind:
      type: string
      enum:
        - WEB
        - ANDROID
        - IOS
      description: Kind of client that owns a session.
    HealthAccessPurpose:
      type: string
      enum:
        - DAILY_CARE
        - EMERGENCY
        - ENROLLMENT_ADMIN
        - GUARDIAN_REVIEW
        - MEDICAL_UPDATE
      description: Purpose of accessing a child health profile (audit log `purpose`).
    AbsenceKind:
      type: string
      enum:
        - SICK
        - VACATION
        - OTHER
      description: Absence category.
    MealSlot:
      type: string
      enum:
        - BREAKFAST
        - SNACK_AM
        - LUNCH
        - SNACK_PM
      description: Meal slot identifiers (two distinct snack ids).
    DeviceInfo:
      type: object
      description: Describes the client creating a session.
      properties:
        clientKind:
          $ref: "#/components/schemas/ClientKind"
        deviceName:
          type: string
          description: Human-readable device/browser name shown in the session list.
          maxLength: 120
        deviceId:
          type: string
          description: App-generated stable device id (mobile only).
          maxLength: 128
      required:
        - clientKind
    RegisterRequest:
      type: object
      properties:
        invitationToken:
          type: string
          description: Raw invitation token from the e-mail link. Self-registration without an invitation is not allowed.
          minLength: 32
          maxLength: 256
        password:
          type: string
          description: Password (Argon2id hashed server-side). Minimum 12 characters; checked against breached-password lists.
          format: password
          minLength: 12
          maxLength: 256
        givenName:
          type: string
          description: Given name (no auto-transliteration).
          minLength: 1
          maxLength: 100
        familyName:
          type: string
          description: Family name.
          minLength: 1
          maxLength: 100
        preferredLocale:
          $ref: "#/components/schemas/Locale"
        device:
          $ref: "#/components/schemas/DeviceInfo"
      required:
        - invitationToken
        - password
        - givenName
        - familyName
        - device
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          description: Account e-mail (case-insensitive).
          format: email
          maxLength: 254
        password:
          type: string
          description: Password.
          format: password
          minLength: 1
          maxLength: 256
        device:
          $ref: "#/components/schemas/DeviceInfo"
      required:
        - email
        - password
        - device
      additionalProperties: false
    TokenPair:
      type: object
      description: Issued only in `bearerAuth` mode. In `cookieAuth` mode tokens are delivered as HttpOnly cookies and this object is absent.
      properties:
        accessToken:
          type: string
          description: Opaque access token (bearer mode only). Never logged, never in URLs.
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: Access token expiry (≈10 min) (RFC 3339 instant, UTC).
        refreshToken:
          type: string
          description: Opaque rotating refresh token (bearer mode only). Single use; reuse revokes the whole session family.
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: Refresh idle expiry (≈7 days, sliding; absolute ≈30 days from login) (RFC 3339 instant, UTC).
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
    AuthResult:
      type: object
      description: Result of login / refresh / MFA verification.
      properties:
        status:
          type: string
          enum:
            - AUTHENTICATED
            - MFA_REQUIRED
            - EMAIL_VERIFICATION_REQUIRED
          description: Outcome of the credential step.
        sessionId:
          type:
            - string
            - "null"
          format: uuid
          description: Session id (present when `AUTHENTICATED`).
        tokens:
          oneOf:
            - $ref: "#/components/schemas/TokenPair"
            - type: "null"
        csrfToken:
          type:
            - string
            - "null"
          description: Double-submit CSRF token (cookie mode only); send as `X-CSRF-Token` on mutating requests.
        mfaChallengeToken:
          type:
            - string
            - "null"
          description: Short-lived (5 min) opaque challenge token to pass to `POST /auth/mfa/totp/verify` when `MFA_REQUIRED`.
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
      required:
        - status
    RefreshRequest:
      type: object
      description: Body is optional in cookie mode.
      properties:
        refreshToken:
          type: string
          description: Refresh token (bearer mode). Omit in cookie mode (cookie is used).
      additionalProperties: false
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh token of the current session (bearer mode). Omit in cookie mode.
      additionalProperties: false
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Session id.
        clientKind:
          $ref: "#/components/schemas/ClientKind"
        deviceName:
          type:
            - string
            - "null"
          description: Device name.
        userAgent:
          type:
            - string
            - "null"
          description: Truncated user agent.
        createdAt:
          type: string
          format: date-time
          description: Login time (RFC 3339 instant, UTC).
        lastSeenAt:
          type: string
          format: date-time
          description: Last request time (RFC 3339 instant, UTC).
        absoluteExpiresAt:
          type: string
          format: date-time
          description: Absolute expiry (RFC 3339 instant, UTC).
        mfaVerifiedAt:
          type:
            - string
            - "null"
          format: date-time
          description: When MFA passed for this session (RFC 3339 instant, UTC).
        reauthenticatedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Last password/MFA re-entry (RFC 3339 instant, UTC).
        isCurrent:
          type: boolean
          description: True for the session making the request.
      required:
        - id
        - clientKind
        - createdAt
        - lastSeenAt
        - absoluteExpiresAt
        - isCurrent
    CurrentSession:
      type: object
      description: Web session bootstrap payload.
      properties:
        userId:
          type: string
          format: uuid
          description: Authenticated user id.
        sessionId:
          type: string
          format: uuid
          description: Current session id.
        clientKind:
          $ref: "#/components/schemas/ClientKind"
        mfaVerified:
          type: boolean
          description: True when MFA has passed for this session.
        reauthenticatedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Last password/MFA re-entry (RFC 3339 instant, UTC).
        absoluteExpiresAt:
          type: string
          format: date-time
          description: Absolute session expiry (RFC 3339 instant, UTC).
        csrfToken:
          type:
            - string
            - "null"
          description: Double-submit CSRF token (cookie mode only); send as `X-CSRF-Token` on mutating requests.
        user:
          $ref: "#/components/schemas/User"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/MyMembership"
          description: Membership summary (tenant switcher) so the web app can bootstrap without a second round-trip.
      required:
        - userId
        - sessionId
        - clientKind
        - mfaVerified
        - absoluteExpiresAt
        - user
        - memberships
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          description: Raw verification token from the e-mail link.
          minLength: 32
          maxLength: 256
      required:
        - token
      additionalProperties: false
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          description: Account e-mail. The response is identical whether or not the account exists.
          format: email
          maxLength: 254
      required:
        - email
      additionalProperties: false
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          description: Raw reset token from the e-mail link (valid 15 min, single use).
          minLength: 32
          maxLength: 256
        newPassword:
          type: string
          description: New password.
          format: password
          minLength: 12
          maxLength: 256
      required:
        - token
        - newPassword
      additionalProperties: false
    ReauthenticateRequest:
      type: object
      description: Re-enters credentials for a sensitive action; refreshes `Session.reauthenticatedAt` (valid 10 min).
      properties:
        password:
          type: string
          description: Current password.
          format: password
          minLength: 1
          maxLength: 256
        totpCode:
          type: string
          description: TOTP code, required when MFA is enrolled.
          pattern: ^[0-9]{6}$
      required:
        - password
      additionalProperties: false
    ReauthenticateResult:
      type: object
      properties:
        reauthenticatedAt:
          type: string
          format: date-time
          description: Time of re-authentication (RFC 3339 instant, UTC).
        validUntil:
          type: string
          format: date-time
          description: Until when sensitive actions are allowed without re-entry (RFC 3339 instant, UTC).
      required:
        - reauthenticatedAt
        - validUntil
    TotpSetupResult:
      type: object
      properties:
        secretUri:
          type: string
          description: "`otpauth://` provisioning URI (shown once, never logged)."
        secretBase32:
          type: string
          description: Manual-entry secret (shown once).
        expiresAt:
          type: string
          format: date-time
          description: Setup must be confirmed before (RFC 3339 instant, UTC).
      required:
        - secretUri
        - secretBase32
        - expiresAt
    TotpCodeRequest:
      type: object
      properties:
        code:
          type: string
          description: 6-digit TOTP code.
          pattern: ^[0-9]{6}$
      required:
        - code
      additionalProperties: false
    TotpVerifyRequest:
      type: object
      properties:
        mfaChallengeToken:
          type: string
          description: Challenge token returned by login with `MFA_REQUIRED`.
        code:
          type: string
          description: 6-digit TOTP code or a recovery code.
          minLength: 6
          maxLength: 24
      required:
        - mfaChallengeToken
        - code
      additionalProperties: false
    RecoveryCodes:
      type: object
      properties:
        codes:
          type: array
          items:
            type: string
            description: Single-use recovery code.
          description: Ten single-use recovery codes (shown once; only hashes are stored).
          minItems: 10
          maxItems: 10
        generatedAt:
          type: string
          format: date-time
          description: Generation time (RFC 3339 instant, UTC).
      required:
        - codes
        - generatedAt
    PushTokenRegistration:
      type: object
      properties:
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          description: Push platform.
        token:
          type: string
          description: FCM/APNs device token.
          minLength: 16
          maxLength: 4096
        appVersion:
          type: string
          description: Client app version.
          maxLength: 32
      required:
        - platform
        - token
      additionalProperties: false
    PushToken:
      type: object
      description: Registration metadata. The token value is never returned.
      properties:
        id:
          type: string
          format: uuid
          description: Registration id.
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          description: Push platform.
        sessionId:
          type:
            - string
            - "null"
          format: uuid
          description: Session that registered the token.
        appVersion:
          type:
            - string
            - "null"
          description: App version.
        createdAt:
          type: string
          format: date-time
          description: Registered at (RFC 3339 instant, UTC).
        lastSeenAt:
          type: string
          format: date-time
          description: Last refresh (RFC 3339 instant, UTC).
      required:
        - id
        - platform
        - createdAt
        - lastSeenAt
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: User id.
        email:
          type: string
          description: E-mail.
          format: email
        emailVerifiedAt:
          type:
            - string
            - "null"
          format: date-time
          description: E-mail verification time (RFC 3339 instant, UTC).
        givenName:
          type: string
          description: Given name.
        familyName:
          type: string
          description: Family name.
        preferredLocale:
          $ref: "#/components/schemas/Locale"
        status:
          type: string
          enum:
            - ACTIVE
