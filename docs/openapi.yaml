          type: string
          format: uuid
          description: Organization.
        givenName:
          type: string
          description: Given name.
        familyName:
          type: string
          description: Family name.
        dateOfBirth:
          type: string
          format: date
          description: Date of birth (calendar date, YYYY-MM-DD).
        photoFileId:
          type:
            - string
            - "null"
          format: uuid
          description: Profile photo file (resolve via `/files/{fileId}/access-url`).
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          description: Status.
        currentEnrollment:
          oneOf:
            - $ref: "#/components/schemas/EnrollmentRef"
            - type: "null"
        hasCriticalHealthAlert:
          type:
            - boolean
            - "null"
          description: >-
            Boolean indicator only ("open the health profile before acting"); carries no medical content. `null` for callers without staff
            role. Not returned by the current implementation (health profiles are not implemented; always null, so omitted).
        version:
          type: integer
          description: Optimistic-concurrency version.
          minimum: 1
      required:
        - id
        - organizationId
        - givenName
        - familyName
        - dateOfBirth
        - status
        - version
    Child:
      allOf:
        - $ref: "#/components/schemas/ChildSummary"
        - type: object
          properties:
            generalNotes:
              type:
                - string
                - "null"
              description: Non-sensitive notes only (e.g. "brings own blanket"). Medical information must go to the health profile.
            enrollments:
              type: array
              items:
                $ref: "#/components/schemas/EnrollmentRef"
              description: Enrollment history.
            guardians:
              type: array
              items:
                $ref: "#/components/schemas/Guardian"
              description: Guardian links (staff see all; a parent sees only their own link).
            pickupPersons:
              type: array
              items:
                $ref: "#/components/schemas/PickupPerson"
              description: Active pickup persons.
            createdAt:
              type: string
              format: date-time
              description: Created (RFC 3339 instant, UTC).
            updatedAt:
              type: string
              format: date-time
              description: Updated (RFC 3339 instant, UTC).
          required:
            - enrollments
            - guardians
            - pickupPersons
            - createdAt
            - updatedAt
      description: Detail representation. Never contains health data; use `GET /children/{childId}/health`.
    ChildCreate:
      type: object
      description: No national id numbers or document scans are accepted.
      properties:
        givenName:
          type: string
          description: Given name.
          minLength: 1
          maxLength: 100
        familyName:
          type: string
          description: Family name.
          minLength: 1
          maxLength: 100
        dateOfBirth:
          type: string
          format: date
          description: Date of birth (after 2000-01-01, not in the future) (calendar date, YYYY-MM-DD).
        generalNotes:
          type: string
          description: Non-sensitive notes.
          maxLength: 2000
        initialEnrollment:
          type: object
          description: Optional initial enrollment created atomically.
          properties:
            groupId:
              type: string
              format: uuid
              description: Group.
            validFrom:
              type: string
              format: date
              description: From (calendar date, YYYY-MM-DD).
            validTo:
              type: string
              format: date
              description: To (optional) (calendar date, YYYY-MM-DD).
          required:
            - groupId
            - validFrom
          additionalProperties: false
      required:
        - givenName
        - familyName
        - dateOfBirth
      additionalProperties: false
    ChildUpdate:
      type: object
      properties:
        givenName:
          type: string
          description: Given name.
          minLength: 1
          maxLength: 100
        familyName:
          type: string
          description: Family name.
          minLength: 1
          maxLength: 100
        dateOfBirth:
          type: string
          format: date
          description: Date of birth (calendar date, YYYY-MM-DD).
        generalNotes:
          type:
            - string
            - "null"
          description: Non-sensitive notes.
          maxLength: 2000
        photoFileId:
          type:
            - string
            - "null"
          format: uuid
          description: >-
            READY file with purpose `CHILD_PROFILE_PHOTO`; null removes the profile photo. The files module is not implemented yet: a
            non-null value answers `422 NOT_SUPPORTED`; only `null` is accepted.
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          description: Status.
        version:
          type: integer
          minimum: 1
          description: Expected version; alternative to the `If-Match` header (one of the two is required, `428` otherwise).
      description: Unknown fields -> `422 UNKNOWN_FIELD`; a body with only `version` -> `422 EMPTY`.
      additionalProperties: false
      minProperties: 1
    Enrollment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Enrollment id.
        organizationId:
          type: string
          format: uuid
          description: Organization.
        childId:
          type: string
          format: uuid
          description: Child.
        groupId:
          type: string
          format: uuid
          description: Group.
        groupName:
          type: string
          description: Group name.
        locationId:
          type: string
          format: uuid
          description: Location of the group.
        validFrom:
          type: string
          format: date
          description: From (calendar date, YYYY-MM-DD).
        validTo:
          type:
            - string
            - "null"
          format: date
          description: To (calendar date, YYYY-MM-DD).
        status:
          type: string
          enum:
            - PLANNED
            - ACTIVE
            - ENDED
            - CANCELLED
          description: Status.
        endReason:
          type:
            - string
            - "null"
          description: End reason.
        createdAt:
          type: string
          format: date-time
          description: Created (RFC 3339 instant, UTC).
        updatedAt:
          type: string
          format: date-time
          description: Updated (RFC 3339 instant, UTC).
      required:
        - id
        - organizationId
        - childId
        - groupId
        - groupName
        - locationId
        - validFrom
        - status
        - createdAt
        - updatedAt
    EnrollmentCreate:
      type: object
      description: >-
        Overlapping PLANNED/ACTIVE enrollment → `409 ENROLLMENT_OVERLAP`. Moving a child between groups = end the current enrollment and
        create a new one, or send `endCurrentEnrollment: true` to do both in one request.
      properties:
        groupId:
          type: string
          format: uuid
          description: Group.
        validFrom:
          type: string
          format: date
          description: From (calendar date, YYYY-MM-DD).
        validTo:
          type: string
          format: date
          description: To (optional) (calendar date, YYYY-MM-DD).
        endCurrentEnrollment:
          type: boolean
          default: false
          description: >-
            When true, the enrollment covering the day before `validFrom` is ended (end reason MOVED) in the same transaction, so a group
            change needs one request.
      required:
        - groupId
        - validFrom
    EnrollmentEnd:
      type: object
      properties:
        validTo:
          type: string
          format: date
          description: Last day in the group (≥ validFrom, ≥ today unless ATTENDANCE_CORRECT) (calendar date, YYYY-MM-DD).
        endReason:
          type: string
          description: Reason.
          maxLength: 200
      required:
        - validTo
      additionalProperties: false
