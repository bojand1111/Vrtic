          type: integer
          description: Hours before the day starts after which a schedule change is flagged `isLateChange`.
          minimum: 0
          maximum: 168
        lateArrivalGraceMinutes:
          type: integer
          description: Minutes after expected arrival before a child counts as late.
          minimum: 0
          maximum: 180
        dayOpensAt:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Day opens (wall-clock HH:MM in the organization timezone).
          examples:
            - "08:00"
        dayClosesAt:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
