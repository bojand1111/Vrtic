            - "null"
          format: uuid
          description: Location filter.
        totals:
          type: object
          properties:
            workingDays:
              type: integer
              description: Working days in range.
              minimum: 0
            expectedChildDays:
              type: integer
              description: Sum of expected child-days.
              minimum: 0
            presentChildDays:
              type: integer
              description: Child-days with at least one visit.
              minimum: 0
            absentChildDays:
              type: integer
              description: Child-days with absence context.
              minimum: 0
            notArrivedChildDays:
              type: integer
              description: Expected but never arrived and no absence.
              minimum: 0
            unscheduledChildDays:
              type: integer
              description: Unscheduled present child-days.
              minimum: 0
            lateArrivals:
              type: integer
              description: Late arrivals.
              minimum: 0
            attendanceRatePct:
              type: number
              description: present / expected × 100.
              minimum: 0
              maximum: 100
          required:
            - workingDays
            - expectedChildDays
            - presentChildDays
            - absentChildDays
            - notArrivedChildDays
            - unscheduledChildDays
            - lateArrivals
            - attendanceRatePct
        byGroup:
          type: array
          items:
            type: object
            properties:
              groupId:
                type: string
                format: uuid
                description: Group.
              groupName:
                type: string
                description: Name.
              expectedChildDays:
                type: integer
                description: Expected.
                minimum: 0
              presentChildDays:
                type: integer
                description: Present.
                minimum: 0
              absentChildDays:
                type: integer
                description: Absent.
                minimum: 0
              notArrivedChildDays:
                type: integer
                description: Expected but never arrived and no absence.
                minimum: 0
              unscheduledChildDays:
                type: integer
                description: Unscheduled present child-days.
                minimum: 0
              lateArrivals:
                type: integer
                description: Late arrivals.
                minimum: 0
              attendanceRatePct:
                type: number
                description: Rate.
                minimum: 0
                maximum: 100
            required:
              - groupId
              - groupName
              - expectedChildDays
              - presentChildDays
              - absentChildDays
              - notArrivedChildDays
              - unscheduledChildDays
              - lateArrivals
              - attendanceRatePct
          description: Per-group breakdown.
        byChild:
          type: array
          description: Per-child breakdown (one row per child and group), the basis of the CSV export.
          items:
            type: object
            properties:
              childId:
                type: string
                format: uuid
                description: Child.
              givenName:
                type: string
                description: Given name.
              familyName:
                type: string
                description: Family name.
              groupId:
                type: string
                format: uuid
                description: Group.
              groupName:
                type: string
                description: Group name.
              expectedDays:
                type: integer
                minimum: 0
                description: Expected days.
              presentDays:
                type: integer
                minimum: 0
                description: Present days.
              absentSickDays:
                type: integer
                minimum: 0
                description: Expected days absent with kind SICK.
              absentVacationDays:
                type: integer
                minimum: 0
                description: Expected days absent with kind VACATION.
              absentOtherDays:
                type: integer
                minimum: 0
                description: Expected days absent with kind OTHER.
              notArrivedDays:
                type: integer
                minimum: 0
                description: Expected, never arrived, no absence.
              unscheduledDays:
                type: integer
                minimum: 0
                description: Present without being expected.
              lateArrivals:
                type: integer
                minimum: 0
                description: Late arrivals.
              attendanceRatePct:
                type: number
                minimum: 0
                maximum: 100
                description: present / expected × 100.
            required:
              - childId
              - givenName
              - familyName
              - groupId
              - groupName
              - expectedDays
              - presentDays
              - absentSickDays
              - absentVacationDays
              - absentOtherDays
              - notArrivedDays
              - unscheduledDays
              - lateArrivals
              - attendanceRatePct
        byDate:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                description: Date (calendar date, YYYY-MM-DD).
              counters:
                $ref: "#/components/schemas/DailyOverviewCounters"
            required:
              - date
              - counters
          description: Per-date breakdown up to `countedTo` (empty unless the range is at most 62 days).
        generatedAt:
          type: string
          format: date-time
          description: Generated (RFC 3339 instant, UTC).
      required:
        - organizationId
        - from
        - to
        - totals
        - byGroup
        - byChild
        - byDate
        - generatedAt
    PrivacyRequest:
      type: object
