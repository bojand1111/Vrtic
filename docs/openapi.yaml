        absencesToday:
          type: integer
          description: Active absences covering the date.
          minimum: 0
        lateScheduleChangesToday:
          type: integer
          description: Late schedule changes for the date.
          minimum: 0
        locations:
          type: array
          items:
            type: object
            properties:
              locationId:
                type: string
                format: uuid
                description: Location.
              name:
                type: string
                description: Name.
              groupsCount:
                type: integer
                description: Groups.
                minimum: 0
              counters:
                $ref: "#/components/schemas/DailyOverviewCounters"
            required:
              - locationId
              - name
              - groupsCount
              - counters
          description: Per location.
        groups:
          type: array
          items:
            type: object
            properties:
              groupId:
                type: string
                format: uuid
                description: Group.
              locationId:
                type: string
                format: uuid
                description: Location.
              name:
                type: string
                description: Name.
              counters:
                $ref: "#/components/schemas/DailyOverviewCounters"
            required:
              - groupId
              - locationId
              - name
              - counters
          description: Per group.
        latestAnnouncements:
          type: array
          items:
            $ref: "#/components/schemas/Announcement"
          description: Up to 5 latest published announcements.
          maxItems: 5
        upcomingEvents:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEvent"
          description: Up to 5 upcoming calendar events.
          maxItems: 5
        subscription:
          oneOf:
            - $ref: "#/components/schemas/Subscription"
            - type: "null"
        generatedAt:
          type: string
          format: date-time
          description: Generated (RFC 3339 instant, UTC).
      required:
        - organizationId
        - date
        - timezone
        - counters
        - childrenActive
        - staffActive
        - guardiansPending
        - invitationsPending
        - absencesToday
        - lateScheduleChangesToday
        - locations
        - groups
        - latestAnnouncements
        - upcomingEvents
        - generatedAt
