    HealthPayload:
      type: object
      description: Decrypted health payload (schema version 1). Only ever returned by the health endpoints; never in lists, pushes or logs.
      properties:
        allergies:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: Allergen code from the shared list (e.g. `PEANUT`, `MILK`) or `OTHER`.
                maxLength: 40
              severity:
                type: string
                enum:
                  - MILD
                  - MODERATE
                  - SEVERE
                description: Severity.
              note:
                type: string
                description: Free text (encrypted at rest).
                maxLength: 500
            required:
              - code
              - severity
          description: Allergies.
          maxItems: 50
        specialNeeds:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: Special-need code or `OTHER`.
                maxLength: 40
              note:
                type: string
                description: Free text.
                maxLength: 1000
            required:
              - code
          description: Special needs / accommodations.
          maxItems: 50
        medicalNotes:
          type: string
          description: Medical notes (encrypted at rest).
          maxLength: 4000
        emergencyContact:
          type: object
          description: Emergency contact.
          properties:
            fullName:
              type: string
              description: Name.
              maxLength: 200
            phone:
              type: string
              description: Phone.
              maxLength: 32
            relationship:
              type: string
              description: Relationship.
              maxLength: 60
          required:
            - fullName
            - phone
      required:
