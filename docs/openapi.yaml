        refEntityId:
          type:
            - string
            - "null"
          format: uuid
          description: Referenced entity id.
        createdAt:
          type: string
          format: date-time
          description: Created (RFC 3339 instant, UTC).
        readAt:
          type:
            - string
            - "null"
          format: date-time
          description: Read (RFC 3339 instant, UTC).
      required:
        - id
        - kind
        - titleKey
        - titleArgs
        - createdAt
        - readAt
    NotificationMarkReadRequest:
