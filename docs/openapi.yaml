        organizationId:
          type: string
          format: uuid
          description: Organization.
        purpose:
          $ref: "#/components/schemas/FilePurpose"
        status:
          type: string
          enum:
            - PENDING_UPLOAD
            - QUARANTINED
            - SCANNING
            - READY
            - REJECTED
            - DELETED
          description: "Lifecycle: upload → quarantine → scan → ready/rejected."
        declaredMime:
          type: string
          description: Declared MIME.
        detectedMime:
          type:
            - string
            - "null"
          description: Detected MIME.
        sizeBytes:
          type:
            - integer
            - "null"
          description: Size.
        originalFilename:
          type:
            - string
            - "null"
          description: Filename.
        rejectionReason:
          type:
            - string
            - "null"
          description: Rejection code (`MIME_MISMATCH`, `MALWARE`, `TOO_LARGE`).
        variants:
          type: array
          items:
            $ref: "#/components/schemas/FileVariant"
          description: Derived variants (same permissions as original).
        uploadedByMembershipId:
          type: string
          format: uuid
          description: Uploader.
        createdAt:
          type: string
          format: date-time
          description: Created (RFC 3339 instant, UTC).
        readyAt:
          type:
            - string
            - "null"
          format: date-time
          description: Ready (RFC 3339 instant, UTC).
      required:
        - id
