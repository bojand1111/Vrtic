          description: Child given name.
        familyName:
          type: string
          description: Child family name.
        groupId:
          type:
            - string
            - "null"
          format: uuid
          description: Group the child is enrolled in on the date.
        groupName:
          type:
            - string
            - "null"
          description: Name of that group.
        changeKind:
          type: string
          enum:
            - TEMPLATE_REPLACED
            - OVERRIDE_SET
            - OVERRIDE_REMOVED
          description: What changed.
        affectedFrom:
          type: string
          format: date
          description: First affected day (calendar date, YYYY-MM-DD).
        affectedTo:
          type:
            - string
            - "null"
          format: date
          description: Last affected day (omitted when open-ended).
        isLateChange:
          type: boolean
          description: Made after the change deadline.
        actorMembershipId:
          type:
            - string
            - "null"
          format: uuid
          description: Membership that made the change.
        actorName:
          type:
            - string
            - "null"
          description: Name of that member.
        actorRole:
          type:
            - string
            - "null"
          description: Role of that member.
        before:
          description: Previous state (times and flags only); omitted when none.
        after:
          description: New state (times and flags only); omitted when none.
