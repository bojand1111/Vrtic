        organizationId:
          type: string
          format: uuid
          description: Organization.
        childId:
          type: string
          format: uuid
          description: Child.
        childGivenName:
          type: string
          description: Child given name (for lists without a second lookup).
        childFamilyName:
          type: string
          description: Child family name.
        kind:
          $ref: "#/components/schemas/AbsenceKind"
        dateFrom:
          type: string
          format: date
          description: First day (calendar date, YYYY-MM-DD).
        dateTo:
          type: string
          format: date
          description: Last day (inclusive) (calendar date, YYYY-MM-DD).
        note:
          type:
            - string
            - "null"
          description: Optional non-medical note.
        status:
          type: string
          enum:
            - ACTIVE
            - CANCELLED
