          format: date-time
          description: Created (RFC 3339 instant, UTC).
        updatedAt:
          type: string
          format: date-time
          description: Updated (RFC 3339 instant, UTC).
      required:
        - id
        - childId
        - overrideDate
        - attends
        - isLateChange
        - createdByMembershipId
        - version
        - createdAt
        - updatedAt
    DayOverrideSet:
      type: object
      properties:
        attends:
          type: boolean
          description: Attends.
        arrivalTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Arrival (required when attends) (wall-clock HH:MM in the organization timezone).
          examples:
            - "08:00"
        departureTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Departure (required when attends) (wall-clock HH:MM in the organization timezone).
          examples:
            - "08:00"
        reason:
          type: string
          description: Reason.
          maxLength: 300
      required:
        - attends
      additionalProperties: false
    ScheduleDay:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Date (calendar date, YYYY-MM-DD).
        weekday:
          type: integer
          description: ISO weekday.
          minimum: 1
          maximum: 7
        isExpected:
          type: boolean
          description: Expected to attend.
        expectedArrival:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Expected arrival (wall-clock HH:MM in the organization timezone).
          examples:
            - "08:00"
        expectedDeparture:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Expected departure (wall-clock HH:MM in the organization timezone).
          examples:
            - "08:00"
        source:
          $ref: "#/components/schemas/ScheduleSource"
        isLateChange:
          type: boolean
          description: Override created after the deadline.
        overrideId:
          type:
            - string
            - "null"
          format: uuid
          description: Override producing this day.
        absenceId:
          type:
            - string
            - "null"
          format: uuid
          description: Absence producing this day.
        closureDayId:
          type:
            - string
            - "null"
          format: uuid
          description: Closure producing this day.
        isFrozen:
          type: boolean
          description: Historical day whose plan will not change any more.
        isEditable:
          type: boolean
          description: Whether the caller may still change this day (deadline, frozen, closure).
      required:
        - date
        - weekday
        - isExpected
        - source
        - isLateChange
        - isFrozen
        - isEditable
    WeekSchedule:
      type: object
      properties:
        childId:
          type: string
          format: uuid
          description: Child.
        weekStart:
          type: string
          format: date
          description: Monday of the week (calendar date, YYYY-MM-DD).
        timezone:
          type: string
          description: Timezone used for wall-clock times (IANA timezone identifier).
          examples:
            - Europe/Belgrade
          maxLength: 64
        version:
          type: integer
          description: Aggregate version = sum of template + override versions for the week; returned as `ETag`.
          minimum: 0
        days:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleDay"
          description: Seven days Monday..Sunday.
          minItems: 7
          maxItems: 7
        changeDeadlineHours:
          type: integer
          description: Organization deadline.
          minimum: 0
      required:
        - childId
        - weekStart
        - timezone
        - version
        - days
        - changeDeadlineHours
    WeekScheduleUpdate:
      type: object
      description: "Atomic: either every listed day is applied or none. Frozen/closure days → `409 DAY_NOT_EDITABLE`."
      properties:
        days:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                description: Date within the requested week (calendar date, YYYY-MM-DD).
              attends:
                type: boolean
                description: Attends.
              arrivalTime:
                type: string
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                description: Arrival (wall-clock HH:MM in the organization timezone).
                examples:
                  - "08:00"
              departureTime:
                type: string
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                description: Departure (wall-clock HH:MM in the organization timezone).
                examples:
                  - "08:00"
            required:
              - date
              - attends
            additionalProperties: false
          description: Days to set as overrides (1..7). Days not listed are unchanged. A day equal to the template removes the override.
          minItems: 1
          maxItems: 7
        reason:
          type: string
          description: Reason.
          maxLength: 300
      required:
        - days
      additionalProperties: false
    DailyPlan:
      type: object
      properties:
        childId:
          type: string
          format: uuid
          description: Child.
        groupId:
          type:
            - string
            - "null"
          format: uuid
          description: Group on that date.
        planDate:
          type: string
          format: date
          description: Date (calendar date, YYYY-MM-DD).
        isExpected:
          type: boolean
          description: Expected.
        expectedArrival:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Expected arrival (wall-clock HH:MM in the organization timezone).
          examples:
            - "08:00"
        expectedDeparture:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Expected departure (wall-clock HH:MM in the organization timezone).
          examples:
            - "08:00"
        source:
          $ref: "#/components/schemas/ScheduleSource"
        absenceId:
          type:
            - string
            - "null"
          format: uuid
          description: Absence.
        frozenAt:
          type:
            - string
            - "null"
          format: date-time
          description: Frozen at (null while recomputable) (RFC 3339 instant, UTC).
      required:
        - childId
        - groupId
        - planDate
        - isExpected
        - source
        - frozenAt
    DailyPlanList:
      type: object
      properties:
        childId:
          type: string
          format: uuid
          description: Child.
        from:
          type: string
          format: date
          description: From (calendar date, YYYY-MM-DD).
        to:
          type: string
          format: date
          description: To (calendar date, YYYY-MM-DD).
        plans:
          type: array
          items:
            $ref: "#/components/schemas/DailyPlan"
          description: One entry per date.
      required:
        - childId
        - from
        - to
        - plans
    SchedulePreviewRequest:
      type: object
      description: Computes daily plans as they WOULD look after applying the proposed changes. Nothing is persisted.
      properties:
        from:
          type: string
          format: date
          description: Range start (calendar date, YYYY-MM-DD).
        to:
          type: string
          format: date
          description: Range end (max 92 days) (calendar date, YYYY-MM-DD).
        proposedTemplate:
          $ref: "#/components/schemas/ScheduleTemplateCreate"
        proposedOverrides:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                description: Date (calendar date, YYYY-MM-DD).
              attends:
                type: boolean
                description: Attends.
              arrivalTime:
                type: string
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                description: Arrival (wall-clock HH:MM in the organization timezone).
                examples:
                  - "08:00"
              departureTime:
                type: string
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                description: Departure (wall-clock HH:MM in the organization timezone).
                examples:
                  - "08:00"
            required:
              - date
              - attends
            additionalProperties: false
          description: Overrides to simulate.
          maxItems: 92
      required:
        - from
        - to
      additionalProperties: false
    SchedulePreview:
      type: object
      properties:
        childId:
          type: string
          format: uuid
          description: Child.
        from:
          type: string
          format: date
          description: From (calendar date, YYYY-MM-DD).
        to:
          type: string
          format: date
          description: To (calendar date, YYYY-MM-DD).
        plans:
          type: array
          items:
            $ref: "#/components/schemas/DailyPlan"
          description: Computed plans.
        changedDates:
          type: array
          items:
            type: string
            format: date
            description: Date (calendar date, YYYY-MM-DD).
          description: Dates whose expectation differs from the currently stored plan.
        lateChangeDates:
          type: array
          items:
            type: string
            format: date
            description: Date (calendar date, YYYY-MM-DD).
          description: Dates that would be flagged as late changes.
        blockedDates:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                description: Date (calendar date, YYYY-MM-DD).
              code:
                type: string
                description: Why it cannot change (`FROZEN`, `CLOSURE`, `ACTIVE_ABSENCE`).
            required:
              - date
              - code
          description: Dates that cannot be changed.
      required:
        - childId
        - from
        - to
        - plans
        - changedDates
        - lateChangeDates
        - blockedDates
    ClosureDay:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Closure id.
        organizationId:
          type: string
          format: uuid
          description: Organization.
        locationId:
          type:
            - string
            - "null"
          format: uuid
          description: Location (null = whole organization).
        closureDate:
          type: string
          format: date
          description: Date (calendar date, YYYY-MM-DD).
        name:
          type: string
          description: Name / reason.
        createdAt:
          type: string
          format: date-time
          description: Created (RFC 3339 instant, UTC).
      required:
        - id
        - organizationId
        - locationId
        - closureDate
        - name
        - createdAt
    ClosureDayCreate:
      type: object
      properties:
        locationId:
          type: string
          format: uuid
          description: Location (omit for whole organization).
        closureDate:
          type: string
          format: date
          description: Date (calendar date, YYYY-MM-DD).
        name:
          type: string
          description: Name.
          minLength: 1
          maxLength: 120
      required:
        - closureDate
        - name
      additionalProperties: false
    Absence:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Absence id.
        organizationId:
          type: string
          format: uuid
          description: Organization.
        childId:
          type: string
          format: uuid
          description: Child.
        kind:
          $ref: "#/components/schemas/AbsenceKind"
        dateFrom:
          type: string
          format: date
          description: First day (calendar date, YYYY-MM-DD).
        dateTo:
          type: string
          format: date
          description: Last day (inclusive) (calendar date, YYYY-MM-DD).
        note:
          type:
            - string
            - "null"
          description: Optional non-medical note.
        status:
          type: string
          enum:
            - ACTIVE
            - CANCELLED
          description: Status.
        reportedByMembershipId:
          type: string
          format: uuid
          description: Reporter.
        cancelledByMembershipId:
          type:
            - string
            - "null"
          format: uuid
          description: Canceller.
        cancelledAt:
          type:
            - string
            - "null"
          format: date-time
          description: Cancelled (RFC 3339 instant, UTC).
        version:
          type: integer
          description: Version.
          minimum: 1
        createdAt:
          type: string
          format: date-time
          description: Created (RFC 3339 instant, UTC).
        updatedAt:
          type: string
          format: date-time
          description: Updated (RFC 3339 instant, UTC).
      required:
        - id
        - organizationId
        - childId
        - kind
        - dateFrom
        - dateTo
        - status
        - reportedByMembershipId
        - version
        - createdAt
        - updatedAt
    AbsenceCreate:
      type: object
      description: >-
        Overlap with an ACTIVE absence → `409 ABSENCE_OVERLAP` (`conflictingIds`). Absences apply immediately regardless of the schedule
        deadline. Reporting an absence for a child that is currently checked in does NOT check the child out.
      properties:
        childId:
          type: string
          format: uuid
          description: Child.
        kind:
          $ref: "#/components/schemas/AbsenceKind"
        dateFrom:
          type: string
          format: date
          description: First day (calendar date, YYYY-MM-DD).
        dateTo:
          type: string
          format: date
          description: Last day (inclusive, ≥ dateFrom, ≤ dateFrom + 365) (calendar date, YYYY-MM-DD).
        note:
          type: string
          description: Optional note; no medical justification required.
          maxLength: 500
      required:
        - childId
        - kind
        - dateFrom
        - dateTo
      additionalProperties: false
    AttendanceStatus:
      type: string
      enum:
        - NOT_ARRIVED
        - CHECKED_IN
        - CHECKED_OUT
      description: Projection status.
    AttendanceCommandBase:
      type: object
      properties:
        commandId:
          type: string
          format: uuid
          description: Client-generated idempotency key. Re-sending the same commandId returns the original outcome (`DUPLICATE`).
        expectedVersion:
          type: integer
          description: "`AttendanceDay.version` the client last saw (0 when no day row exists yet). Mismatch → `409 VERSION_MISMATCH`."
          minimum: 0
        occurredAt:
          type: string
          format: date-time
          description: >-
            Business time of the action (may be earlier than now when synced from offline; must be within the attendance date and not in the
            future) (RFC 3339 instant, UTC).
        attendanceDate:
          type: string
          format: date
          description: Attendance date in the organization timezone. Defaults to the date of `occurredAt`. (calendar date, YYYY-MM-DD).
        deviceId:
          type: string
          description: Device id for audit.
          maxLength: 128
      required:
        - commandId
        - expectedVersion
        - occurredAt
    CheckInCommand:
      allOf:
        - $ref: "#/components/schemas/AttendanceCommandBase"
        - type: object
          properties:
            note:
              type: string
              description: Optional note.
              maxLength: 200
      description: >-
        NOT_ARRIVED/CHECKED_OUT → CHECKED_IN. Opens a new visit; an unexpected child becomes `isUnscheduled`. Already CHECKED_IN → `409
        ALREADY_CHECKED_IN`.
    CheckOutCommand:
      allOf:
        - $ref: "#/components/schemas/AttendanceCommandBase"
        - type: object
          properties:
            note:
              type: string
              description: Optional note.
              maxLength: 200
      description: CHECKED_IN → CHECKED_OUT. Closes the open visit. No open visit → `409 NO_OPEN_VISIT`.
    MarkAbsentCommand:
      allOf:
        - $ref: "#/components/schemas/AttendanceCommandBase"
        - type: object
          properties:
            absenceKind:
              $ref: "#/components/schemas/AbsenceKind"
            note:
              type: string
              description: Optional note.
              maxLength: 200
          required:
            - absenceKind
      description: Sets absence context for the day. Does not change status; a CHECKED_IN child is not checked out.
    ClearAbsenceCommand:
      allOf:
        - $ref: "#/components/schemas/AttendanceCommandBase"
      description: Clears the absence context for the day.
    CorrectionCommand:
      allOf:
        - $ref: "#/components/schemas/AttendanceCommandBase"
        - type: object
          properties:
            correctionOfEventId:
              type: string
              format: uuid
              description: Event being corrected.
            reason:
              type: string
              description: Mandatory reason.
              minLength: 3
              maxLength: 500
            correctedOccurredAt:
              type: string
              format: date-time
              description: New business time for the corrected event (RFC 3339 instant, UTC).
            voidEvent:
              type: boolean
              description: Void the event instead of re-timing it.
              default: false
          required:
            - correctionOfEventId
            - reason
      description: Appends a CORRECTION event (original event stays immutable) and re-projects the day. Requires `ATTENDANCE_CORRECT`.
    AttendanceVisit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Visit id.
        sequenceNo:
          type: integer
          description: 1-based sequence within the day.
          minimum: 1
        checkInAt:
          type: string
          format: date-time
          description: Check-in (RFC 3339 instant, UTC).
        checkOutAt:
          type:
            - string
            - "null"
          format: date-time
          description: Check-out (null while open) (RFC 3339 instant, UTC).
        checkInEventId:
          type: string
          format: uuid
          description: Check-in event.
        checkOutEventId:
          type:
            - string
            - "null"
          format: uuid
          description: Check-out event.
      required:
        - id
        - sequenceNo
        - checkInAt
        - checkOutAt
        - checkInEventId
        - checkOutEventId
    AttendanceDay:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Attendance day id.
        childId:
          type: string
          format: uuid
          description: Child.
        groupId:
          type:
            - string
            - "null"
          format: uuid
          description: Group.
        attendanceDate:
          type: string
          format: date
          description: Date (calendar date, YYYY-MM-DD).
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        absenceKind:
          oneOf:
            - $ref: "#/components/schemas/AbsenceKind"
            - type: "null"
        isExpected:
          type: boolean
          description: Expected per daily plan.
        expectedArrival:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Expected arrival (wall-clock HH:MM in the organization timezone).
          examples:
            - "08:00"
        expectedDeparture:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Expected departure (wall-clock HH:MM in the organization timezone).
          examples:
            - "08:00"
        isUnscheduled:
          type: boolean
          description: Present although not expected.
        isLate:
          type: boolean
          description: First check-in after expected arrival + grace.
        firstCheckInAt:
          type:
            - string
            - "null"
          format: date-time
          description: First check-in (RFC 3339 instant, UTC).
        lastCheckOutAt:
          type:
            - string
            - "null"
          format: date-time
          description: Last check-out (RFC 3339 instant, UTC).
        openVisitId:
          type:
            - string
            - "null"
          format: uuid
          description: Open visit (iff CHECKED_IN).
        visitsCount:
          type: integer
          description: Visits.
          minimum: 0
        visits:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceVisit"
          description: Visits of the day.
        version:
          type: integer
          description: Projection version; send back as `expectedVersion`.
          minimum: 0
        lastEventId:
          type:
            - string
            - "null"
          format: uuid
          description: Last applied event.
        updatedAt:
          type: string
          format: date-time
          description: Updated (RFC 3339 instant, UTC).
      required:
        - id
        - childId
        - groupId
        - attendanceDate
        - status
        - absenceKind
        - isExpected
        - isUnscheduled
        - isLate
        - visitsCount
        - visits
        - version
        - updatedAt
    AttendanceEvent:
      type: object
      description: Immutable event.
      properties:
        id:
          type: string
          format: uuid
          description: Event id.
        attendanceDayId:
          type: string
          format: uuid
          description: Day.
        childId:
          type: string
          format: uuid
          description: Child.
        eventType:
          type: string
          enum:
            - CHECK_IN
            - CHECK_OUT
            - CORRECTION
            - ABSENCE_MARKED
            - ABSENCE_CLEARED
            - UNSCHEDULED_PRESENT
          description: Event type.
        occurredAt:
          type: string
          format: date-time
          description: Business time (RFC 3339 instant, UTC).
        recordedAt:
          type: string
          format: date-time
          description: Server time (RFC 3339 instant, UTC).
        actorMembershipId:
          type: string
          format: uuid
          description: Actor.
        source:
          type: string
          enum:
            - MOBILE
            - WEB
            - OFFLINE_SYNC
            - SYSTEM
          description: Source.
        commandId:
          type: string
          format: uuid
          description: Command id.
        deviceId:
          type:
            - string
            - "null"
          description: Device.
        resultingVersion:
          type: integer
          description: Version after this event.
          minimum: 1
        correctionOfEventId:
          type:
            - string
            - "null"
          format: uuid
          description: Corrected event.
        correctionReason:
          type:
            - string
            - "null"
          description: Correction reason.
      required:
        - id
        - attendanceDayId
        - childId
        - eventType
        - occurredAt
        - recordedAt
        - actorMembershipId
        - source
        - commandId
        - resultingVersion
    AttendanceCommandResult:
      type: object
      properties:
        commandId:
          type: string
          format: uuid
          description: Command id.
        outcome:
          type: string
          enum:
            - ACCEPTED
            - DUPLICATE
          description: Outcome.
        attendanceDay:
          $ref: "#/components/schemas/AttendanceDay"
        eventId:
          type:
            - string
            - "null"
          format: uuid
          description: Event created (null for DUPLICATE).
      required:
        - commandId
        - outcome
        - attendanceDay
        - eventId
    DailyOverviewCounters:
      type: object
      description: Same definition is used by backend, mobile and web.
      properties:
        expected:
          type: integer
          description: Expected = present + departed + absent + notArrived.
          minimum: 0
        present:
          type: integer
          description: Expected and currently CHECKED_IN.
          minimum: 0
        departed:
          type: integer
          description: Expected and CHECKED_OUT.
          minimum: 0
        absent:
          type: integer
          description: Expected with absence context and not checked in.
          minimum: 0
        notArrived:
          type: integer
          description: Expected, NOT_ARRIVED, no absence.
          minimum: 0
        late:
          type: integer
          description: Expected, NOT_ARRIVED past arrival + grace (subset of notArrived) or checked in late.
          minimum: 0
        unscheduledPresent:
          type: integer
          description: Not expected but CHECKED_IN (counted separately, not in `expected`).
          minimum: 0
        physicallyPresent:
          type: integer
          description: present + unscheduledPresent.
          minimum: 0
      required:
        - expected
        - present
        - departed
        - absent
        - notArrived
        - late
        - unscheduledPresent
        - physicallyPresent
    DailyOverviewChild:
      type: object
      properties:
        childId:
          type: string
          format: uuid
          description: Child.
        givenName:
          type: string
          description: Given name.
        familyName:
          type: string
          description: Family name.
        photoFileId:
          type:
            - string
            - "null"
          format: uuid
          description: Profile photo.
        hasCriticalHealthAlert:
          type: boolean
          description: Indicator only.
        isExpected:
          type: boolean
          description: Expected.
        expectedArrival:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Expected arrival (wall-clock HH:MM in the organization timezone).
          examples:
            - "08:00"
        expectedDeparture:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Expected departure (wall-clock HH:MM in the organization timezone).
          examples:
            - "08:00"
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        absenceKind:
          oneOf:
            - $ref: "#/components/schemas/AbsenceKind"
            - type: "null"
        overviewState:
          type: string
          enum:
            - PRESENT
            - DEPARTED
            - ABSENT
