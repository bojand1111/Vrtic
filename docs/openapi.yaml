  /organizations/{organizationId}/privacy-requests:
    get:
      operationId: listPrivacyRequests
      tags:
        - Compliance
      summary: List privacy requests
      description: Staff see all requests of the tenant; parents see the ones they submitted.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathOrganizationId"
        - name: status
