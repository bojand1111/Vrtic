# Same-origin reverse proxy: static admin SPA at "/", API at "/api", health at "/health".
# TLS termination happens here (certbot/ACM); the backend listens on 127.0.0.1:8080 only.
# Security headers are set here for the SPA; the API sets its own (see plugins/Plugins.kt).

upstream vrtic_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Rate limiting for auth endpoints (defense in depth; the API also rate limits per account/IP).
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=20r/m;

server {
    listen 443 ssl http2;
    server_name admin.vrtic.example;   # replace per environment

    ssl_certificate     /etc/letsencrypt/live/admin.vrtic.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.vrtic.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 30m;          # uploads go to S3 via signed URLs; API bodies are small

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; connect-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- API ------------------------------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://vrtic_api;
        include /etc/nginx/snippets/vrtic-proxy-headers.conf;
    }
    location /api/ {
        proxy_pass http://vrtic_api;
        include /etc/nginx/snippets/vrtic-proxy-headers.conf;
    }
    location /health/ {
        proxy_pass http://vrtic_api;
        include /etc/nginx/snippets/vrtic-proxy-headers.conf;
        access_log off;
    }

    # --- Static SPA ------------------------------------------------------------------
    root /var/www/vrtic-admin;         # apps/admin-web/dist
    index index.html;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }
}

server {
    listen 80;
    server_name admin.vrtic.example;
    return 301 https://$host$request_uri;
}
